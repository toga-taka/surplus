<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ボード</title>
<style>
  :root{
    --bd: #e5e7eb;
    --muted:#6b7280;
    --chip:#f3f4f6;
    --left: 220px;   /* 担当者列幅 */
    --col: 320px;    /* 日付列幅（幅プルダウンで変更） */
    --gap: 6px;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; color:#111827; }
  header{
    position: sticky; top:0; z-index:50;
    background:#fff; border-bottom:1px solid var(--bd);
    display:flex; align-items:center; gap:10px; padding:8px 10px;
  }
  header h1{ font-size:14px; margin:0 8px 0 0; }
  header .sp{ flex:1 1 auto; }

  /* グリッド全体 */
  #board{
    --days: 14;
  }
  /* 日付ヘッダ（上固定） */
  .dates{
    position: sticky; top:40px; z-index:40; /* headerの直下で固定 */
    background:#fff; border-bottom:1px solid var(--bd);
    display:grid; grid-template-columns: var(--left) repeat(var(--days), var(--col));
  }
  .dates .blank{ position: sticky; left:0; z-index:45; background:#fff; border-right:1px solid var(--bd); }
  .dateHead{
    text-align:center; padding:8px 6px; font-size:13px; white-space:nowrap;
  }
  .dateBadge{
    display:inline-block; font-size:12px; color:#374151; background:#eef2ff; border-radius:999px; padding:2px 8px;
  }
  .sun { color:#ef4444; } .sat{ color:#2563eb; }

  /* rows コンテナ（担当者×日） */
  #rows{ display:block; }
  .row{
    display:grid; grid-template-columns: var(--left) repeat(var(--days), var(--col));
  }
  /* 左の担当者列（左固定） */
  .assignee{
    position: sticky; left:0; z-index:30; background:#fff; border-right:1px solid var(--bd);
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-bottom:1px solid var(--bd);
    white-space:nowrap; font-size:14px;
  }
  .rowHandle{
    cursor:grab; color:#9ca3af; user-select:none;
  }
  .rowHandle:active{ cursor:grabbing; }
  /* マス（lane） */
  .lane{
    border-bottom:1px solid var(--bd); border-right:1px solid var(--bd);
    min-height: 140px; padding:8px;
    display:flex; flex-direction:column; gap:8px; background:#fff;
  }
  .lane.compact{ min-height: 90px; }

  /* カード */
  .card{
    width:100%; background:#fff; border:1px solid var(--bd); border-radius:10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    padding:10px; display:flex; flex-direction:column; gap:8px;
  }
  .card.dragging{ opacity:.6; }
  .cardHead{ display:flex; align-items:center; gap:8px; }
  .pill{ font-size:12px; background:var(--chip); border:1px solid var(--bd); border-radius:999px; padding:2px 8px; }
  .title{ font-size:14px; font-weight:600; }
  .sub{ font-size:12px; color:var(--muted); }
  .meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .chip{ font-size:12px; background:#f9fafb; border:1px solid var(--bd); border-radius:999px; padding:2px 8px; }
  .cardAct{ margin-left:auto; display:flex; gap:6px; }
  .btnIcon{ border:1px solid var(--bd); background:#fff; border-radius:8px; padding:4px 6px; cursor:pointer; }
  .btnIcon:hover{ background:#f9fafb; }
  .ghost{ outline:2px dashed #60a5fa; outline-offset: -2px; }

  /* 編集ダイアログ */
  dialog{ border:1px solid var(--bd); border-radius:12px; padding:12px 14px; width:min(520px, 92vw); }
  dialog form{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  dialog form .full{ grid-column:1/-1; }
  dialog label{ font-size:12px; color:#374151; }
  dialog input, dialog select{ width:100%; padding:6px 8px; border:1px solid var(--bd); border-radius:8px; }
  dialog .actions{ display:flex; justify-content:flex-end; gap:8px; grid-column:1/-1; }
  .btn{ border:1px solid var(--bd); background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; }
  .btn.primary{ background:#111827; color:#fff; border-color:#111827; }

  /* ローディング & トースト */
  #loading{
    position: fixed; inset:0; display:none; place-items:center; background: rgba(255,255,255,.55); z-index:1000;
    font-weight:600;
  }
  #toast{
    position: fixed; right:16px; bottom:16px; background:#111827; color:#fff; border-radius:10px; padding:10px 12px; z-index:900; display:none;
  }

  /* 行折れ回避のためバッジは短縮表記に */
  .sumBadge{ font-size:12px; color:#111827; background:#eef2ff; border-radius:999px; padding:2px 8px; display:inline-block; }

  /* コンパクト */
  .compact .card{ padding:8px; }
</style>
</head>
<body>
<header>
  <h1>ボード</h1>
  <label>開始日 <input type="date" id="start"></label>
  <button class="btn" id="back">«</button>
  <button class="btn" id="fwd">»</button>
  <label>日数
    <select id="days">
      <option>7</option><option selected>14</option><option>21</option><option>28</option><option>60</option>
    </select>
  </label>
  <button class="btn" id="reload">再読み込み</button>
  <div class="sp"></div>
  <label>幅
    <select id="width">
      <option value="280">280</option><option value="320" selected>320</option><option value="360">360</option><option value="420">420</option>
    </select> px
  </label>
  <label><input type="checkbox" id="compact"> コンパクト</label>
</header>

<!-- 日付ヘッダ -->
<div class="dates" id="datesRow">
  <div class="blank"></div>
</div>

<!-- 行（担当者×日） -->
<div id="rows"></div>

<!-- 編集用ダイアログ -->
<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <div class="full"><strong id="dlgTitle"></strong></div>
    <div>
      <label>担当者</label>
      <select id="fAssignee"></select>
    </div>
    <div>
      <label>日付</label>
      <input type="date" id="fDate" />
    </div>
    <div>
      <label>計画</label>
      <input type="number" step="0.01" id="fPlan" />
    </div>
    <div>
      <label>当日予定</label>
      <input type="number" step="0.01" id="fToday" />
    </div>
    <div>
      <label>実績</label>
      <input type="number" step="0.01" id="fActual" />
    </div>
    <div>
      <label>残時間</label>
      <input type="number" step="0.01" id="fRemain" />
    </div>
    <div class="actions">
      <button class="btn" value="cancel">キャンセル</button>
      <button class="btn primary" id="saveBtn" value="ok">保存</button>
    </div>
  </form>
</dialog>

<div id="loading">保存中…</div>
<div id="toast"></div>

<script>
const API = {
  GRID: '/notion_grid.php',
  UPDATE: '/notion_update.php',
};
const el = sel => document.querySelector(sel);
const els = sel => Array.from(document.querySelectorAll(sel));
const fmt = n => (n===null || n===undefined || n==='') ? '0' : Number(n).toString();
const weekdayJ = ['日','月','火','水','木','金','土'];

let users = [];     // [{id,name}]
let dates = [];     // [{date, weekday}]
let items = [];     // Notion rows
let rowIndexByUser = new Map(); // assignee_id -> row element
let cardById = new Map();
let current = { start: '', days: 14 };

function showToast(msg){ const t=el('#toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 1800); }
const Loading = { show(){el('#loading').style.display='grid';}, hide(){el('#loading').style.display='none';} };

function getQuery(){
  const u = new URL(location.href);
  const start = u.searchParams.get('start') || new Date().toISOString().slice(0,10);
  const days  = Number(u.searchParams.get('days') || 14);
  return {start, days};
}
function setQuery(start, days){
  const u = new URL(location.href);
  u.searchParams.set('start', start); u.searchParams.set('days', days);
  history.replaceState(null, '', u.toString());
}

async function load(){
  const q=getQuery();
  current.start=q.start; current.days=q.days;
  document.documentElement.style.setProperty('--days', q.days);
  el('#start').value=q.start; el('#days').value=String(q.days);

  // fetch
  const url = `${API.GRID}?start=${q.start}&days=${q.days}`;
  const res = await fetch(url); const js = await res.json();
  users = js.users || [];
  dates = js.dates || [];
  items = js.items || [];

  buildHeader();
  buildRows();
  placeCards();
}
function buildHeader(){
  const wrap = el('#datesRow');
  wrap.innerHTML = '<div class="blank"></div>';
  dates.forEach(d=>{
    const head=document.createElement('div');
    head.className='dateHead';
    const w = weekdayJ[d.weekday];
    head.innerHTML = `<div>${d.date}（<span class="${w==='日'?'sun':(w==='土'?'sat':'')}">${w}</span>）</div>
      <div class="dateBadge" id="sum-${d.date}">計:0 / 予:0 / 実:0</div>`;
    wrap.appendChild(head);
  });
}
function buildRows(){
  rowIndexByUser.clear();
  el('#rows').innerHTML='';
  // 編集ダイアログの担当者select
  const sel = el('#fAssignee'); sel.innerHTML='';
  users.forEach(u=>{
    const opt=document.createElement('option'); opt.value=u.id; opt.textContent=u.name; sel.appendChild(opt);
  });

  users.forEach(u=>{
    const row=document.createElement('div');
    row.className='row';
    row.dataset.assignee=u.id;

    // assignee col
    const as=document.createElement('div');
    as.className='assignee';
    as.innerHTML=`<span class="rowHandle" title="ドラッグで担当者の順序変更">≡</span>${u.name}`;
    row.appendChild(as);

    // lanes
    dates.forEach(d=>{
      const lane=document.createElement('div');
      lane.className='lane';
      lane.dataset.assignee=u.id;
      lane.dataset.date=d.date;
      row.appendChild(lane);
    });

    el('#rows').appendChild(row);
    rowIndexByUser.set(u.id, row);
  });

  enableRowDrag();
}
function cardEl(it){
  const div=document.createElement('div');
  div.className='card';
  div.draggable=true;
  div.dataset.id=it.id;
  div.dataset.order = String(it.order||0);
  div.innerHTML=`
    <div class="cardHead">
      <span class="pill">${it.customer||''}</span>
      <div class="title">${it.task||''}</div>
      <div class="cardAct">
        <button class="btnIcon btnEdit" title="編集">…</button>
        <span class="btnIcon dragH" title="ドラッグで移動">≡</span>
      </div>
    </div>
    <div class="sub">${it.content||''}</div>
    <div class="meta">
      <span class="chip">計画: <b>${fmt(it.plan)}</b></span>
      <span class="chip">当日予定: <b>${fmt(it.today_plan)}</b></span>
      <span class="chip">実績: <b>${fmt(it.actual)}</b></span>
      <span class="chip">残時間: <b>${fmt(it.remain)}</b></span>
    </div>
  `;
  // events
  div.addEventListener('dragstart', onCardDragStart);
  div.addEventListener('dragend', onCardDragEnd);
  div.querySelector('.btnEdit').addEventListener('click', ()=>openEdit(it));
  div.querySelector('.dragH').addEventListener('mousedown', e=>{
    // つかみやすく
    div.setAttribute('draggable','true');
  });
  return div;
}
function placeCards(){
  // まず全laneクリア
  els('.lane').forEach(l=>l.innerHTML='');
  cardById.clear();
  // 配置
  for(const it of items){
    const lane = document.querySelector(`.lane[data-assignee="${it.assignee_id}"][data-date="${it.date}"]`);
    if(!lane) continue;
    const c = cardEl(it);
    lane.appendChild(c);
    cardById.set(it.id, c);
  }
  recalcSums();
  enableLaneDnD();
}

function recalcSums(){
  // 日付ごと合計
  const map = new Map(); // date -> {plan,today,actual}
  for(const it of items){
    const s = map.get(it.date) || {plan:0,today:0,actual:0};
    s.plan += Number(it.plan || 0);
    s.today+= Number(it.today_plan || 0);
    s.actual+= Number(it.actual || 0);
    map.set(it.date, s);
  }
  dates.forEach(d=>{
    const s = map.get(d.date) || {plan:0,today:0,actual:0};
    const b = el(`#sum-${d.date}`); if(b) b.textContent = `計:${s.plan.toFixed(2)} / 予:${s.today.toFixed(2)} / 実:${s.actual.toFixed(2)}`;
  });
}

/* ========= Drag & Drop: カード ========= */
let dragCard = null;
function onCardDragStart(e){
  dragCard = e.currentTarget;
  dragCard.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  // Firefox対策のダミーデータ
  e.dataTransfer.setData('text/plain', dragCard.dataset.id);
}
function onCardDragEnd(){
  if(dragCard){ dragCard.classList.remove('dragging'); dragCard=null; }
}
function enableLaneDnD(){
  els('.lane').forEach(l=>{
    l.addEventListener('dragover', e=>{
      if(!dragCard) return;
      e.preventDefault();
      const lane = e.currentTarget;
      const after = getInsertBefore(lane, e.clientY);
      if(after==null){
        lane.appendChild(placeholder());
      }else{
        lane.insertBefore(placeholder(), after);
      }
    });
    l.addEventListener('dragleave', e=>{
      if(placeholderEl && e.currentTarget.contains(placeholderEl)){
        // 何もしない（見失うとチラつく）
      }
    });
    l.addEventListener('drop', async e=>{
      e.preventDefault();
      const lane = e.currentTarget;
      if(!dragCard) return;
      // 実DOM移動
      const before = getInsertBefore(lane, e.clientY);
      if(before==null) lane.appendChild(dragCard);
      else lane.insertBefore(dragCard, before);

      // 新しい order を計算
      const elsIn = [...lane.querySelectorAll('.card:not(.dragging)')];
      let newOrder = 0;
      if(elsIn.length===0){
        newOrder = 0;
      }else{
        const idx = elsIn.indexOf(dragCard);
        const prev = elsIn[idx-1]; const next = elsIn[idx+1];
        const a = prev ? Number(prev.dataset.order||0) : 0;
        const b = next ? Number(next.dataset.order||0) : a+20;
        newOrder = Math.floor((a+b)/2);
      }

      // 保存
      const payload = {
        id: dragCard.dataset.id,
        assignee_id: lane.dataset.assignee,
        date: lane.dataset.date,
        order: newOrder
      };
      await patchCard(payload);
      dragCard.dataset.order = String(newOrder);
      clearPlaceholder();
      dragCard.classList.remove('dragging');
      dragCard = null;
    });
  });
}
function getInsertBefore(lane, mouseY){
  const cards=[...lane.querySelectorAll('.card:not(.dragging), .ghost')];
  let before=null;
  for(const c of cards){
    const r=c.getBoundingClientRect();
    const midpoint = r.top + r.height/2;
    if(mouseY < midpoint){ before=c; break; }
  }
  return before;
}
let placeholderEl=null;
function placeholder(){
  if(!placeholderEl){
    placeholderEl=document.createElement('div');
    placeholderEl.className='card ghost';
    placeholderEl.style.height='44px';
  }
  return placeholderEl;
}
function clearPlaceholder(){
  if(placeholderEl && placeholderEl.parentNode) placeholderEl.parentNode.removeChild(placeholderEl);
}

/* ========= Drag & Drop: 担当者行 ========= */
function enableRowDrag(){
  let draggedRow=null, startFromHandle=false;
  els('.row').forEach(row=>{
    row.draggable = true;
    const handle = row.querySelector('.rowHandle');
    handle.addEventListener('mousedown', ()=>{ startFromHandle=true; });
    row.addEventListener('dragstart', e=>{
      if(!startFromHandle){ e.preventDefault(); return; }
      draggedRow=row; e.dataTransfer.setData('text/plain', row.dataset.assignee); startFromHandle=false;
    });
    row.addEventListener('dragend', ()=>{ draggedRow=null; });
  });
  const rowsWrap = el('#rows');
  rowsWrap.addEventListener('dragover', e=>{
    if(!draggedRow) return;
    e.preventDefault();
    const after = getRowInsertBefore(rowsWrap, e.clientY);
    if(after==null) rowsWrap.appendChild(draggedRow);
    else rowsWrap.insertBefore(draggedRow, after);
  });
}
function getRowInsertBefore(container, mouseY){
  const rows = [...container.querySelectorAll('.row')].filter(r=>!r.classList.contains('dragging'));
  let before=null;
  for(const r of rows){
    const rect=r.getBoundingClientRect();
    const mid = rect.top + rect.height/2;
    if(mouseY < mid){ before=r; break; }
  }
  return before;
}

/* ========= 編集 ========= */
let editing=null;
function openEdit(it){
  editing = it;
  el('#dlgTitle').textContent = (it.task||'(無題)');
  el('#fAssignee').value = it.assignee_id || '';
  el('#fDate').value = it.date || '';
  el('#fPlan').value = it.plan ?? '';
  el('#fToday').value = it.today_plan ?? '';
  el('#fActual').value = it.actual ?? '';
  el('#fRemain').value = it.remain ?? '';
  el('#editDlg').showModal();
}
el('#editDlg').addEventListener('close', async ()=>{
  if(el('#editDlg').returnValue !== 'ok') return;
  if(!editing) return;
  const payload = {
    id: editing.id,
    assignee_id: el('#fAssignee').value || null,
    date: el('#fDate').value || null,
    plan: numberOrNull(el('#fPlan').value),
    today_plan: numberOrNull(el('#fToday').value),
    actual: numberOrNull(el('#fActual').value),
    remain: numberOrNull(el('#fRemain').value),
  };
  await patchCard(payload);
  await load(); // 再描画（最も確実）
});
function numberOrNull(v){ if(v===''||v==null) return null; const n=Number(v); return isNaN(n)?null:n; }

async function patchCard(payload){
  try{
    Loading.show();
    const res = await fetch(API.UPDATE, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-HTTP-Method-Override':'PATCH' },
      body: JSON.stringify(payload)
    });
    const js = await res.json().catch(()=> ({}));
    if(!res.ok || (js.status && js.status!==200)){
      console.warn(js); alert('更新に失敗しました'); return;
    }
    showToast('保存しました');
  }finally{ Loading.hide(); }
}

/* ========= ユーザインタフェース ========= */
function shiftDays(n){
  const d = new Date(el('#start').value || new Date().toISOString().slice(0,10));
  d.setDate(d.getDate() + n);
  const ymd = d.toISOString().slice(0,10);
  el('#start').value = ymd;
  setQuery(ymd, Number(el('#days').value||14));
  load();
}
el('#reload').onclick = load;
el('#back').onclick = ()=>shiftDays(-Number(el('#days').value||14));
el('#fwd').onclick  = ()=>shiftDays(+Number(el('#days').value||14));
el('#days').onchange = ()=>{
  document.documentElement.style.setProperty('--days', Number(el('#days').value||14));
  setQuery(el('#start').value, Number(el('#days').value||14));
  load();
};
el('#start').onchange = ()=>{
  setQuery(el('#start').value, Number(el('#days').value||14)); load();
};
el('#width').onchange = ()=>{
  document.documentElement.style.setProperty('--col', el('#width').value+'px');
};
el('#compact').onchange = ()=>{
  document.body.classList.toggle('compact', el('#compact').checked);
  els('.lane').forEach(l=> l.classList.toggle('compact', el('#compact').checked));
};

/* ========= 初期化 ========= */
(function init(){
  const q=getQuery();
  el('#start').value=q.start;
  el('#days').value=String(q.days);
  document.documentElement.style.setProperty('--days', q.days);
  document.documentElement.style.setProperty('--col', (el('#width').value||'320')+'px');
  load();
})();
</script>
</body>
</html>
