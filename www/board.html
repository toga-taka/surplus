<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ボード</title>
<link rel="icon" href="data:,"><!-- 404抑止 -->
<style>
:root{
  --cw: 320px;         /* 1日の横幅（UIで変更可） */
  --lh: 140px;         /* 1セルの最低高さ */
  --bd: #e5e7eb;       /* 枠線 */
  --muted:#6b7280;     /* 補助文字 */
  --pill:#1118270d;    /* pill背景 */
  --ghost:#9ca3af;     /* ゴースト */
  --sun:#fee2e2;       /* 日曜背景 */
  --sat:#e0f2fe;       /* 土曜背景 */
  --head:#ffffff;      /* ヘッダ背景 */
  --left:#ffffff;      /* 左列背景 */
}
*{ box-sizing:border-box }
html,body{ height:100% }
body{
  margin:0; background:#fff; color:#111827;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}

/* ===== ヘッダ ===== */
header{
  position:sticky; top:0; z-index:10;
  display:flex; gap:10px; align-items:center;
  padding:8px 12px; background:#fff; border-bottom:1px solid var(--bd);
}
h1{ font-size:14px; color:#374151; margin:0 4px 0 0 }
label{ color:#374151; font-size:12px; }
input,select,button{ font:inherit }
.btn{ padding:6px 10px; border:1px solid var(--bd); background:#fff; border-radius:8px }
.sep{ flex:1 }

/* ===== ボード ===== */
#boardWrap{ height:calc(100vh - 56px); overflow:auto }
#grid{ position:relative; inline-size:max(100%, calc(var(--cw) * var(--days) + 240px)); }
.rowline{ display:grid; grid-template-columns: 240px repeat(var(--days), var(--cw)); }

/* 固定ヘッダ（日付） */
.head .cell{ position:sticky; top:0; z-index:4; background:var(--head); border-bottom:1px solid var(--bd) }
.date{ padding:10px 12px; font-weight:700; border-right:1px solid var(--bd) }
.date .wd{ font-weight:400; color:var(--muted); margin-left:6px }
.date .sumBadge{ margin-top:6px }

/* 固定左列（担当者） */
.assignee{
  position:sticky; left:0; z-index:3; background:var(--left);
  border-right:1px solid var(--bd); border-bottom:1px solid var(--bd);
  min-height:var(--lh); display:flex; align-items:center; gap:8px; padding:10px 12px;
}
.assignee .name{ font-weight:700 }
.assignee .sum{ margin-left:auto; font-size:12px; color:#374151; background:#f3f4f6; border:1px solid var(--bd); padding:2px 6px; border-radius:999px }
.assignee .rowmv{ display:flex; flex-direction:column; gap:4px; }
.rowmv button{ width:24px; height:20px; border:1px solid var(--bd); border-radius:4px; background:#fff; color:#6b7280 }
.rowmv button:active{ transform:translateY(1px) }

/* セル（担当者×日付） */
.cell{ min-height:var(--lh); position:relative; background:#fff }
.lane{ border-right:1px solid var(--bd); border-bottom:1px solid var(--bd); padding:8px }
.lane[data-weekday="0"]{ background:var(--sun) }
.lane[data-weekday="6"]{ background:var(--sat) }
.sumBadge{
  position:absolute; top:6px; right:8px;
  font-size:12px; background:#f3f4f6; border:1px solid var(--bd);
  padding:2px 6px; border-radius:999px;
}

/* カード */
.card{
  position:relative; background:#fff; border:1px solid var(--bd); border-radius:12px;
  padding:10px 12px; margin:6px 0; box-shadow:0 1px 0 rgba(0,0,0,.05);
}
.card .title{ font-weight:700; margin-bottom:2px }
.card .sub{ color:#374151; margin:2px 0 4px; font-size:13px }
.meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px }
.pill{ display:inline-flex; gap:6px; align-items:center; padding:2px 8px; border:1px solid var(--bd); background:var(--pill); border-radius:999px; font-size:12px }

/* ハンドル & 編集ボタン */
.handles{
  position:absolute; left:6px; top:6px; display:flex; gap:6px;
}
.hbtn,.iconbtn{
  width:24px; height:24px; display:grid; place-content:center;
  border:1px solid var(--bd); border-radius:999px; background:#fff; color:#6b7280;
}
.hbtn:hover,.iconbtn:hover{ background:#f9fafb }
.editBtns{ position:absolute; right:6px; top:6px }

/* ドラッグ中のガイド */
.ghost{ outline:2px dashed var(--ghost); border-radius:12px; height:48px; margin:6px 0 }

/* 編集ダイアログ */
dialog{ border:1px solid var(--bd); border-radius:12px; padding:16px; width:min(520px, 92vw) }
dialog::backdrop{ background:rgba(0,0,0,.25) }
.formrow{ display:grid; grid-template-columns:120px 1fr; gap:10px; align-items:center; margin:8px 0 }
.formrow input,.formrow select{ width:100%; padding:8px; border:1px solid var(--bd); border-radius:8px }
.dlgbtns{ display:flex; justify-content:flex-end; gap:8px; margin-top:12px }

/* 通信中 */
#loading{ position:fixed; inset:0; background:rgba(255,255,255,.55); display:none; align-items:center; justify-content:center; z-index:20 }
#loading .box{ padding:12px 16px; background:#fff; border:1px solid var(--bd); border-radius:12px; font-weight:700; box-shadow:0 10px 30px rgba(0,0,0,.06) }
#loading.show{ display:flex }

.muted{ color:var(--muted) }
</style>
</head>
<body>
<header>
  <h1>ボード</h1>
  <label>開始日</label><input type="date" id="start">
  <label>日数</label>
  <select id="days"><option>7</option><option selected>14</option><option>21</option><option>28</option><option>60</option></select>
  <button class="btn" id="reload">更新</button>
  <label style="margin-left:12px">幅</label>
  <select id="width"><option>280</option><option selected>320</option><option>360</option><option>400</option><option>480</option></select><span class="muted"> px</span>
  <div class="sep"></div>
  <button class="btn" id="toggleRowSort">担当者並び替え</button>
</header>

<div id="boardWrap"><div id="grid"></div></div>

<div id="loading"><div class="box">通信中…</div></div>

<dialog id="editor">
  <form method="dialog" id="editForm">
    <input type="hidden" name="id">
    <div class="formrow"><label>日付</label><input type="date" name="date" required></div>
    <div class="formrow"><label>担当者</label><select name="assignee_id" id="assigneeSelect"></select></div>
    <div class="formrow"><label>計画</label><input type="number" step="0.05" name="plan"></div>
    <div class="formrow"><label>当日予定</label><input type="number" step="0.05" name="today_plan"></div>
    <div class="formrow"><label>実績</label><input type="number" step="0.05" name="actual"></div>
    <div class="formrow"><label>残時間</label><input type="number" step="0.05" name="remain"></div>
    <div class="dlgbtns">
      <button class="btn" value="cancel">キャンセル</button>
      <button class="btn" value="ok" id="saveBtn">保存</button>
    </div>
  </form>
</dialog>

<script>
const el  =(q,p=document)=>p.querySelector(q);
const els =(q,p=document)=>Array.from(p.querySelectorAll(q));
const API = { USERS:'/notion_users.php', GRID:'/notion_grid.php', UPDATE:'/notion_update.php' };
const WD = ['日','月','火','水','木','金','土'];

const Loading={ show(){el('#loading').classList.add('show')}, hide(){el('#loading').classList.remove('show')} };
const E = (html)=>{ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };
const esc = (s)=>String(s??'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const num =(v, keepNull=false)=> (v===''||v==null)?(keepNull?null:0):(isFinite(+v)?+v:0);
const badge=(p=0,t=0,a=0)=>`計:${fmt(p)} / 予:${fmt(t)} / 実:${fmt(a)}`;
const fmt  =(v)=>Number(v||0).toFixed(2).replace(/\.00$/,'');

let STATE={ start:'', days:14, users:[], userMap:new Map(), dates:[], items:[] };
let drag={ active:false, type:null, id:null, startX:0,startY:0, moved:false, ghost:null, originLane:null };

async function getUsers(){
  const r=await fetch(API.USERS); const js=await r.json();
  const list = js.users ?? js ?? [];
  STATE.userMap = new Map(list.map(u=>[u.id, u.name||'(無名)']));
  STATE.users = Array.from(STATE.userMap, ([id,name])=>({id,name}));
}
async function getGrid(){
  const q=new URLSearchParams({start:STATE.start,days:String(STATE.days)});
  const r=await fetch(`${API.GRID}?${q}`); const js=await r.json();
  STATE.dates=(js.dates??[]).map(d=>({date:d.date,weekday:+d.weekday,is_holiday:!!d.is_holiday}));
  STATE.items=(js.items??[]).map(x=>({
    id:x.id, assignee_id:x.assignee_id??null, date:x.date, order:+(x.order??0),
    customer:x.customer??'', task:x.task??'', content:x.content??'',
    plan:+(x.plan??0), today_plan:+(x.today_plan??0), actual:+(x.actual??0), remain:+(x.remain??0),
  }));
  // items 側担当者も union
  for(const it of STATE.items){
    if(it.assignee_id && !STATE.userMap.has(it.assignee_id)) STATE.userMap.set(it.assignee_id, it.assignee_id);
  }
  STATE.users = Array.from(STATE.userMap, ([id,name])=>({id,name}));
}

function build(){
  const grid=el('#grid'); grid.innerHTML=''; grid.style.setProperty('--days', String(STATE.days));
  // ヘッダ
  const head=E(`<div class="rowline head"><div class="cell assignee"><span class="name muted">担当者 / 日付</span></div></div>`);
  for(const d of STATE.dates){
    head.appendChild(E(`<div class="cell date">
      <div>${d.date} <span class="wd">（${WD[d.weekday]}）</span></div>
      <div class="sumBadge" data-date="${esc(d.date)}">${badge()}</div></div>`));
  }
  grid.appendChild(head);
  // 行
  for(const u of STATE.users){
    const row=E(`<div class="rowline"></div>`);
    row.appendChild(E(`<div class="cell assignee" data-assignee-id="${esc(u.id)}">
      <span class="rowmv"><button class="up">▲</button><button class="dn">▼</button></span>
      <span class="name">${esc(u.name||u.id)}</span>
      <span class="sum" data-assignee="${esc(u.id)}">${badge()}</span>
    </div>`));
    for(const d of STATE.dates){
      row.appendChild(E(`<div class="cell lane" data-assignee-id="${esc(u.id)}" data-date="${esc(d.date)}" data-weekday="${d.weekday}">
        <div class="sumBadge">${badge()}</div></div>`));
    }
    grid.appendChild(row);
  }
  placeCards(); wireUI();
}

function placeCards(){
  els('.card').forEach(n=>n.remove());
  const laneSum=new Map(), asgSum=new Map(), dateSum=new Map();
  const kLane=(a,d)=>`${a}|${d}`;
  const add=(map,k,dp)=>{ const o=map.get(k)||{p:0,t:0,a:0}; o.p+=dp.p; o.t+=dp.t; o.a+=dp.a; map.set(k,o); };

  const items=[...STATE.items].sort((a,b)=> a.date===b.date ? a.order-b.order : (a.date<b.date?-1:1));
  for(const it of items){
    const lane=el(`.lane[data-assignee-id="${CSS.escape(it.assignee_id||'')}"][data-date="${CSS.escape(it.date)}"]`);
    if(!lane) continue;
    const card=E(`<div class="card" data-id="${esc(it.id)}" data-order="${it.order}">
      <div class="handles">
        <button class="hbtn handle-in" title="枠内で上下 ⇕">⇕</button>
        <button class="hbtn handle-out" title="枠外へ移動 十">十</button>
      </div>
      <div class="editBtns"><button class="iconbtn edit" title="編集">✎</button></div>
      <div class="title">${esc(it.task||'')}</div>
      <div class="sub">${esc(it.customer||'')}</div>
      <div class="sub muted">${esc(it.content||'')}</div>
      <div class="meta">
        <span class="pill">計画: <b>${fmt(it.plan)}</b></span>
        <span class="pill">当日予定: <b>${fmt(it.today_plan)}</b></span>
        <span class="pill">実績: <b>${fmt(it.actual)}</b></span>
        <span class="pill">残: <b>${fmt(it.remain)}</b></span>
      </div>
    </div>`);
    lane.appendChild(card);

    const dp={p:it.plan||0,t:it.today_plan||0,a:it.actual||0};
    add(laneSum, kLane(it.assignee_id||'', it.date), dp);
    add(asgSum, it.assignee_id||'', dp);
    add(dateSum, it.date, dp);
  }
  // バッジ
  for(const [k,v] of laneSum){
    const [a,d]=k.split('|'); const n=el(`.lane[data-assignee-id="${CSS.escape(a)}"][data-date="${CSS.escape(d)}"] .sumBadge`);
    if(n) n.textContent = badge(v.p,v.t,v.a);
  }
  for(const [a,v] of asgSum){
    const n=el(`.assignee .sum[data-assignee="${CSS.escape(a)}"]`); if(n) n.textContent=badge(v.p,v.t,v.a);
  }
  for(const [d,v] of dateSum){
    const n=els('.head .date .sumBadge').find(x=>x.dataset.date===d); if(n) n.textContent=badge(v.p,v.t,v.a);
  }
}

function wireUI(){
  // 幅
  el('#width').onchange=e=>document.documentElement.style.setProperty('--cw', e.target.value+'px');
  // 再読み込み
  el('#reload').onclick=reload;
  // 行（担当者）上下
  els('.assignee .up').forEach(b=>b.onclick=()=>moveRow(b.closest('.rowline'), -1));
  els('.assignee .dn').forEach(b=>b.onclick=()=>moveRow(b.closest('.rowline'), +1));
  el('#toggleRowSort').onclick=()=>alert('行の上下は左の ▲/▼ でできます');

  // 編集
  els('.card .edit').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); openEditor(b.closest('.card').dataset.id); });

  // ドラッグ（ハンドル別）
  els('.handle-in').forEach(h=>h.addEventListener('pointerdown', e=>startDrag(e,'in')));
  els('.handle-out').forEach(h=>h.addEventListener('pointerdown', e=>startDrag(e,'out')));
}

function moveRow(row,dir){
  const grid=el('#grid'); const rows=els('.rowline',grid).filter(r=>!r.classList.contains('head'));
  const i=rows.indexOf(row); const to=i+dir; if(to<0 || to>=rows.length) return;
  dir<0 ? grid.insertBefore(row, rows[to]) : grid.insertBefore(row, rows[to].nextSibling);
}

/* ==== DnD ==== */
function startDrag(e,type){
  const card=e.currentTarget.closest('.card'); const lane=card.closest('.lane');
  drag={ active:true, type, id:card.dataset.id, startX:e.clientX, startY:e.clientY, moved:false, ghost:E('<div class="ghost"></div>'), originLane:lane };
  lane.appendChild(drag.ghost);
  const onMove=(ev)=>{ if(!drag.moved && (Math.abs(ev.clientX-drag.startX)>8 || Math.abs(ev.clientY-drag.startY)>8)) drag.moved=true; };
  const onUp=async(ev)=>{
    document.removeEventListener('pointermove',onMove); document.removeEventListener('pointerup',onUp);
    if(!drag.moved){ cleanupDrag(); return; } // クリック扱い
    const target = laneFromPoint(ev) || drag.originLane;
    let dropLane = target;
    // 枠内専用なら同一レーン以外を無効化
    if(drag.type==='in' && target!==drag.originLane) dropLane = drag.originLane;

    const cards=els('.card', dropLane); const last=cards[cards.length-1];
    const newOrder = last ? (+last.dataset.order + 10) : 10;

    const payload={ id:drag.id, assignee_id: dropLane.dataset.assigneeId||null, date: dropLane.dataset.date, order:newOrder };
    const it = STATE.items.find(x=>x.id===drag.id);
    const changed = !(it.assignee_id===payload.assignee_id && it.date===payload.date && it.order===payload.order);
    if(!changed){ cleanupDrag(); return; }

    try{
      Loading.show();
      await patch(payload);
      Object.assign(it, payload);
      placeCards(); wireUI();
    }catch(err){ console.error(err); alert('移動に失敗しました'); }
    finally{ Loading.hide(); cleanupDrag(); }
  };
  document.addEventListener('pointermove',onMove,{passive:true});
  document.addEventListener('pointerup',onUp,{once:true});
}
function laneFromPoint(e){ const t=document.elementFromPoint(e.clientX,e.clientY); return t ? t.closest('.lane') : null; }
function cleanupDrag(){ try{ drag.ghost?.remove(); }catch{} drag={active:false}; }

/* ==== 編集 ==== */
function openEditor(id){
  const it=STATE.items.find(x=>x.id===id); if(!it) return;
  const dlg=el('#editor'), f=el('#editForm'), sel=el('#assigneeSelect');
  sel.innerHTML='<option value="">（未設定）</option>'+STATE.users.map(u=>`<option value="${esc(u.id)}">${esc(u.name||u.id)}</option>`).join('');
  f.id.value=it.id; f.date.value=it.date; f.assignee_id.value=it.assignee_id||''; f.plan.value=it.plan||''; f.today_plan.value=it.today_plan||''; f.actual.value=it.actual||''; f.remain.value=it.remain||'';
  dlg.showModal();
  dlg.onclose=async()=>{ if(dlg.returnValue!=='ok') return;
    const payload={ id:f.id.value, date:f.date.value, assignee_id:f.assignee_id.value||null, plan:num(f.plan.value,true), today_plan:num(f.today_plan.value,true), actual:num(f.actual.value,true), remain:num(f.remain.value,true) };
    try{ Loading.show(); await patch(payload); Object.assign(it,payload); placeCards(); wireUI(); }
    catch(err){ console.error(err); alert('保存に失敗しました'); }
    finally{ Loading.hide(); }
  };
}

/* ==== API ==== */
async function patch(payload){
  const r=await fetch(API.UPDATE,{ method:'POST', headers:{'Content-Type':'application/json','X-HTTP-Method-Override':'PATCH'}, body:JSON.stringify(payload) });
  if(!r.ok){ let m='更新に失敗しました'; try{ const j=await r.json(); if(j?.notion?.message) m=j.notion.message; }catch{} throw new Error(m); }
  return r.json().catch(()=>({}));
}

/* ==== 起動 ==== */
function initFromURL(){
  const u=new URL(location.href);
  STATE.start = u.searchParams.get('start') || new Date().toISOString().slice(0,10);
  STATE.days  = +(u.searchParams.get('days') || 14);
  el('#start').value=STATE.start; el('#days').value=String(STATE.days);
  document.documentElement.style.setProperty('--cw', (el('#width').value||'320')+'px');
}
async function reload(){
  try{ Loading.show(); await getUsers(); await getGrid(); build(); }
  catch(err){ console.error(err); alert('読み込みに失敗しました'); }
  finally{ Loading.hide(); }
}
(function(){ initFromURL(); reload(); })();
</script>
</body>
</html>
