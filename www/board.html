<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ボード</title>
<style>
:root{
  --bd:#e5e7eb;
  --muted:#6b7280;
  --red:#ef4444;
  --blue:#3b82f6;
  --bg:#f8fafc;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:#fff;color:#111}
header{display:flex;gap:.5rem;align-items:center;padding:.5rem .75rem;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;z-index:5}
header h1{margin:0 .5rem 0 0;font-size:16px}
input[type="date"],select,button{height:30px;border:1px solid var(--bd);border-radius:6px;padding:0 .5rem;background:#fff}
button{cursor:pointer}
#saving{position:fixed;right:12px;bottom:12px;padding:.5rem .75rem;border:1px solid var(--bd);border-radius:8px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.08);opacity:0;pointer-events:none;transition:opacity .2s}
#saving.show{opacity:1}
#saving.ok{background:#ecfdf5;border-color:#a7f3d0}

.grid{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
.th{display:grid;grid-template-columns:220px repeat(var(--cols),1fr);border-bottom:1px solid var(--bd)}
.th .cell{padding:.5rem;border-right:1px solid var(--bd);background:#fff;position:sticky;top:56px;z-index:3}
.th .cell.head{background:#fafafa;font-weight:600}
.th .cell .badge{display:inline-block;font-size:12px;color:#111;background:#f3f4f6;border:1px solid var(--bd);border-radius:999px;padding:2px 8px;margin-left:6px}
.th .cell.sun{color:var(--red)}
.th .cell.sat{background:#f0f7ff}
.th .cell.hol{color:#fff;background:#ef4444;border-color:#ef4444}

.body{display:grid;grid-template-columns:220px repeat(var(--cols),1fr)}
.rowHead{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:.5rem;display:flex;align-items:center;gap:.5rem;position:sticky;left:0;background:#fff;z-index:2}
.rowHead .handle{cursor:grab;color:var(--muted)}
.lane{min-height:140px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);position:relative;background:#fff}
.lane[data-weekday="6"]{background:#f8fbff}
.lane[data-weekday="0"]{background:#fff5f5}

.card{margin:8px; padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.04);cursor:grab}
.card:active{cursor:grabbing}
.meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:6px}
.tt{font-weight:600;font-size:13px;margin-bottom:4px}
.kvs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.kv{font-size:12px;border:1px solid var(--bd);border-radius:999px;padding:2px 8px;background:#fafafa}
.kv .label{color:var(--muted)}
.kv .num[contenteditable="true"]{outline:2px solid transparent;min-width:16px;display:inline-block}
.kv .num.edited{outline-color:#fde68a;background:#fffbeb}

.ghost{border:2px dashed #a3a3a3;background:#fafafa;opacity:.8}
.dropping{box-shadow:inset 0 0 0 2px #60a5fa}

.compact .card{margin:4px;padding:6px;border-radius:6px}
.compact .lane{min-height:100px}
</style>
</head>
<body>
<header>
  <h1>ボード</h1>
  <label>開始日 <input id="start" type="date"></label>
  <label>日数
    <select id="days">
      <option>7</option><option selected>14</option><option>21</option><option>28</option><option>60</option>
    </select>
  </label>
  <button id="prev">«</button>
  <button id="next">»</button>
  <button id="reload">再読み込み</button>
  <label style="margin-left:auto"><input id="compact" type="checkbox"> コンパクト</label>
</header>

<div id="saving">通信中…</div>

<div id="board">
  <div class="th" id="th"></div>
  <div class="body" id="body"></div>
</div>

<script>
/* ========= helpers ========= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const fmtW=w=>['日','月','火','水','木','金','土'][w];
const todayStr=()=>new Date().toISOString().slice(0,10);
function ymd(d){return d.toISOString().slice(0,10);}
function by(q){ return document.querySelector(q); }

const Saving = {
  el: $('#saving'),
  show(msg='通信中…'){ this.el.textContent=msg; this.el.classList.add('show'); },
  hide(){ this.el.classList.remove('show'); this.el.classList.remove('ok'); this.el.textContent='通信中…'; },
  ok(){ this.el.textContent='保存しました'; this.el.classList.add('ok'); setTimeout(()=>this.hide(),800); }
};

/* ========= state ========= */
let STATE = { dates:[], users:[], items:[] };

/* ========= API ========= */
async function getGrid(start, days){
  const r = await fetch(`/notion_grid.php?start=${start}&days=${days}`);
  if(!r.ok) throw new Error('grid fetch failed');
  return r.json();
}
async function getUsers(){
  const r = await fetch('/notion_users.php');
  if(!r.ok) return {users:[]};
  return r.json();
}
async function patch(payload){
  const r = await fetch('/notion_update.php',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-HTTP-Method-Override':'PATCH'},
    body:JSON.stringify(payload)
  });
  let js=null; try{ js = await r.json(); }catch(_){}
  if(!r.ok || (js && js.status && js.status!==200)) throw js||new Error('patch failed');
  return js||{status:200};
}

/* ========= build ========= */
function buildHeader(){
  const th = $('#th');
  th.style.setProperty('--cols', STATE.dates.length);
  th.innerHTML='';
  const head = document.createElement('div');
  head.className='cell head';
  head.textContent='担当者';
  th.appendChild(head);

  for(const d of STATE.dates){
    const cell=document.createElement('div');
    cell.className='cell';
    const w = d.weekday;
    if(w===0) cell.classList.add('sun');
    if(w===6) cell.classList.add('sat');
    cell.innerHTML = `
      <div style="display:flex;align-items:baseline;gap:.5rem;">
        <div>${d.date.replaceAll('-','/')}（${fmtW(w)}）</div>
        <span class="badge" id="sum-${d.date}">計:0 / 予:0 / 実:0</span>
      </div>`;
    th.appendChild(cell);
  }
}

function buildBody(){
  const body = $('#body');
  body.style.setProperty('--cols', STATE.dates.length);
  body.innerHTML='';

  // 行：必ず「全ユーザー」を出す（items が無くても）
  for(const u of STATE.users){
    const rh = document.createElement('div');
    rh.className='rowHead';
    rh.innerHTML = `<span class="handle">≡</span> <span class="name">${u.name||'(無名)'}</span>`;
    rh.dataset.assigneeId = u.id || '';
    body.appendChild(rh);

    for(const d of STATE.dates){
      const lane = document.createElement('div');
      lane.className='lane';
      lane.dataset.assigneeId = u.id || '';
      lane.dataset.date = d.date;
      lane.dataset.weekday = d.weekday;
      enableLaneDnD(lane);
      body.appendChild(lane);
    }
  }
}

function renderCards(){
  // いったんクリア
  $$('.lane').forEach(l=>l.innerHTML='');

  // 合計のためのマップ date => sums
  const sums = new Map(); // date -> {plan,today,actual}

  const byKey = (a,b)=> (a.order||0)-(b.order||0);

  for(const it of STATE.items.slice().sort(byKey)){
    const lane = $(`.lane[data-assignee-id="${cssEscape(it.assignee_id||'')}"][data-date="${it.date}"]`);
    if(!lane) continue;

    const card = cardEl(it);
    lane.appendChild(card);

    const s = sums.get(it.date) || {plan:0,today:0,actual:0};
    s.plan += Number(it.plan||0);
    s.today += Number(it.today_plan||0);
    s.actual += Number(it.actual||0);
    sums.set(it.date, s);
  }

  // 合計バッジ更新
  for(const d of STATE.dates){
    const s = sums.get(d.date) || {plan:0,today:0,actual:0};
    const el = by(`#sum-${d.date}`);
    if(el) el.textContent = `計:${trim0(s.plan)} / 予:${trim0(s.today)} / 実:${trim0(s.actual)}`;
  }
}

function buildBoard(){
  buildHeader();
  buildBody();
  renderCards();
}

/* ========= card / edit ========= */
function cardEl(item){
  const div = document.createElement('div');
  div.className='card';
  div.draggable = true;
  div.dataset.id = item.id;
  div.dataset.order = item.order ?? 0;
  enableCardDnD(div);

  const customer = esc(item.customer||'');
  const task = esc(item.task||'');
  const content = esc(item.content||'');

  div.innerHTML = `
    <div class="tt">${task||'(タスクなし)'}</div>
    <div class="meta">
      ${customer?`<span>${customer}</span>`:''}
      ${content?`<span>${content}</span>`:''}
    </div>
    <div class="kvs">
      <span class="kv"><span class="label">計画</span>：
        <span class="num" data-field="plan" contenteditable="true">${numfmt(item.plan)}</span>
      </span>
      <span class="kv"><span class="label">当日予定</span>：
        <span class="num" data-field="today_plan" contenteditable="true">${numfmt(item.today_plan)}</span>
      </span>
      <span class="kv"><span class="label">実績</span>：
        <span class="num" data-field="actual" contenteditable="true">${numfmt(item.actual)}</span>
      </span>
    </div>
  `;

  // inline edit
  for(const n of $$('.num', div)){
    n.addEventListener('focus', e=>{ n.dataset._old = n.textContent.trim(); });
    n.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); n.blur(); }
      if(e.key==='Escape'){ e.preventDefault(); n.textContent=n.dataset._old||''; n.blur(); }
    });
    n.addEventListener('input', e=>{ n.classList.add('edited'); });
    n.addEventListener('blur', async e=>{
      const field = n.dataset.field;
      const val = parseNum(n.textContent);
      const old = parseNum(n.dataset._old||'');
      n.classList.remove('edited');
      if(val===old) return;

      try{
        Saving.show();
        await patch({ id: item.id, [field]: val });
        // ローカル反映
        const idx = STATE.items.findIndex(x=>x.id===item.id);
        if(idx>=0){ STATE.items[idx][field] = val; }
        // 表示更新（このカードだけ数値を書き戻し & 合計再計算）
        n.textContent = numfmt(val);
        renderCards();
        Saving.ok();
      }catch(err){
        console.warn(err);
        alert('保存に失敗しました');
        n.textContent = numfmt(old);
      }
    });
  }
  return div;
}

function numfmt(v){ return (v===null || v===undefined || v==='')?'':String(v); }
function parseNum(t){
  const s = String(t).trim();
  if(s==='') return null;
  const n = Number(s.replace(/[^0-9.+-]/g,''));
  return isFinite(n)?n:null;
}
function trim0(n){ return (Math.round(n*100)/100)||0; }

/* ========= DnD ========= */
let dragData=null, ghost=null;

function enableCardDnD(card){
  card.addEventListener('dragstart', e=>{
    dragData = {
      id: card.dataset.id,
      fromLane: card.closest('.lane'),
      order: Number(card.dataset.order||0),
      el: card
    };
    ghost = card.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width = card.getBoundingClientRect().width+'px';
    setTimeout(()=>card.style.opacity='.3',0);
    e.dataTransfer.effectAllowed='move';
  });
  card.addEventListener('dragend', e=>{
    if(dragData?.el) dragData.el.style.opacity='';
    dragData=null;
    if(ghost?.parentNode) ghost.parentNode.removeChild(ghost);
    ghost=null;
    $$('.lane').forEach(l=>l.classList.remove('dropping'));
  });
}

function enableLaneDnD(lane){
  lane.addEventListener('dragover', e=>{
    if(!dragData) return;
    e.preventDefault();
    lane.classList.add('dropping');

    if(!ghost) return;
    const before = getBefore(lane, e.clientY);
    if(before) lane.insertBefore(ghost, before);
    else lane.appendChild(ghost);
  });

  lane.addEventListener('dragleave', e=>{
    lane.classList.remove('dropping');
  });

  lane.addEventListener('drop', async e=>{
    if(!dragData) return;
    e.preventDefault();
    lane.classList.remove('dropping');

    // 新しい order を決定
    const children = $$('.card', lane).filter(x=>x!==dragData.el);
    let before = getBefore(lane, e.clientY);
    let newOrder = 10;
    if(children.length){
      if(before){
        const idx = children.indexOf(before);
        const prev = children[idx-1];
        const a = prev ? Number(prev.dataset.order||0) : 0;
        const b = Number(before.dataset.order||0);
        newOrder = Math.floor((a+b)/2) || (a+1);
      }else{
        const last = children[children.length-1];
        const a = Number(last.dataset.order||0);
        newOrder = a + 10;
      }
    }

    const assignee_id = lane.dataset.assigneeId || null;
    const date = lane.dataset.date;

    try{
      Saving.show();
      await patch({ id: dragData.id, assignee_id, date, order: newOrder });

      // ローカル更新
      const idx = STATE.items.findIndex(x=>x.id===dragData.id);
      if(idx>=0){
        STATE.items[idx].assignee_id = assignee_id;
        STATE.items[idx].date = date;
        STATE.items[idx].order = newOrder;
      }
      renderCards();
      Saving.ok();
    }catch(err){
      console.warn(err);
      alert('移動に失敗しました');
    }
  });
}

function getBefore(lane, y){
  const cards = $$('.card', lane).filter(x=>x!==ghost && x!==dragData?.el);
  for(const c of cards){
    const r = c.getBoundingClientRect();
    if(y < r.top + r.height/2) return c;
  }
  return null;
}

/* ========= utils ========= */
function esc(s){ return String(s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function cssEscape(s){ return CSS.escape(String(s)); }

/* ========= load / controls ========= */
function setFromQuery(){
  const p = new URLSearchParams(location.search);
  const s = p.get('start') || todayStr();
  const d = Number(p.get('days') || 14);
  $('#start').value = s;
  $('#days').value = d;
}

async function reload(){
  const s = $('#start').value;
  const d = Number($('#days').value||14);
  history.replaceState(null,'',`?start=${s}&days=${d}`);
  try{
    Saving.show();
    const [grid, usersResp] = await Promise.all([ getGrid(s,d), getUsers() ]);
    const users = (usersResp.users && usersResp.users.length) ? usersResp.users : (grid.users||[]);
    STATE = { dates: grid.dates||[], users: users||[], items: grid.items||[] };
    buildBoard();
  }finally{ Saving.hide(); }
}

function bindUI(){
  $('#prev').addEventListener('click', ()=>{
    const dt = new Date($('#start').value); dt.setDate(dt.getDate() - Number($('#days').value||14));
    $('#start').value = ymd(dt); reload();
  });
  $('#next').addEventListener('click', ()=>{
    const dt = new Date($('#start').value); dt.setDate(dt.getDate() + Number($('#days').value||14));
    $('#start').value = ymd(dt); reload();
  });
  $('#reload').addEventListener('click', reload);
  $('#start').addEventListener('change', reload);
  $('#days').addEventListener('change', reload);
  $('#compact').addEventListener('change', e=>{
    document.body.classList.toggle('compact', e.target.checked);
  });
}

/* ========= boot ========= */
(async function init(){
  setFromQuery();
  bindUI();
  await reload();
})();
</script>
</body>
</html>
