<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surplus Board</title>
<style>
  :root{
    --left: 220px;         /* 左の担当者列の幅 */
    --col: 300px;          /* 日付列の幅 */
    --gap: 8px;
    --bd:#d1d5db;
    --muted:#6b7280;
    --toolbarH: 48px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",Helvetica,Arial;background:#fff}

  /* ツールバー（横スクロールの外側に置く＝常に固定） */
  .toolbar{
    position: sticky; top:0; left:0; z-index:120;
    display:flex; gap:8px; align-items:center;
    padding:10px 12px; background:#fff; border-bottom:1px solid var(--bd);
    height: var(--toolbarH);
  }
  .toolbar input, .toolbar select, .toolbar button{
    padding:6px 10px; border:1px solid var(--bd); border-radius:8px; background:#fff;
  }
  .toolbar .grow{flex:1}

  /* 横スクロールはこの中だけに閉じ込める */
  .wrap{height:calc(100% - var(--toolbarH));}
  .hscroll{
    height:100%;
    overflow:auto;                    /* ← 横/縦スクロールはここ */
    padding:8px;
    background:#fff;
  }

  /* 日付ヘッダ（縦に固定／横はグリッドと一緒に動く） */
  .dates{
    position: sticky; top: calc(var(--toolbarH)); /* ビューポート基準で固定 */
    z-index:110;                                   /* カードより上 */
    background:#fff;
    border-bottom:1px solid var(--bd);
    display:grid; grid-template-columns: var(--left) repeat(var(--days), var(--col));
    gap: var(--gap);
    /* ヘッダ下にうっすら影を入れて“透け”防止 */
    box-shadow: 0 3px 8px rgba(0,0,0,.05);
    pointer-events: none; /* クリックは素通り */
  }
  .dates .blank{
    position:sticky; left:0; z-index:111; background:#fff; border-right:1px solid var(--bd);
    pointer-events:auto; display:flex; align-items:center; padding:8px 10px; font-weight:600;
  }
  .dateHead{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border-left:1px dashed var(--bd); background:#fff;
  }
  .dateHead .d{ font-weight:600; }
  .dateHead .w{ color:var(--muted); font-size:12px; }
  .dateHead.sun .d, .dateHead.sun .w{ color:#dc2626; }
  .dateHead.sat .d, .dateHead.sat .w{ color:#2563eb; }
  .dateHead .sum{
    font-size:12px; background:#f3f4f6; border:1px solid var(--bd); border-radius:999px; padding:2px 8px;
    white-space:nowrap;
  }

  /* 行（担当者ごと） */
  .rows{ display:flex; flex-direction:column; gap:var(--gap); padding-top:8px; }
  .row{
    display:grid; grid-template-columns: var(--left) repeat(var(--days), var(--col));
    gap: var(--gap);
    align-items: stretch;
    border-top:2px solid var(--bd);          /* ← 担当者の上線（先頭にも付く） */
    background:#fff;
  }
  .name{
    position: sticky; left:0; z-index:100; background:#fff;
    padding:8px 10px; border-right:1px solid var(--bd); min-height:48px; display:flex; align-items:center; gap:8px;
  }
  .name .label{ font-weight:700; }
  .name .tot{ margin-left:auto; font-size:12px; color:var(--muted); }

  /* 各マス（枠は全日付に必ず表示される） */
  .lane{
    position:relative;
    min-height:140px; padding:8px; border:1px solid var(--bd); border-radius:10px; background:#fff;
  }
  .laneSum{
    position:absolute; top:6px; right:8px;
    font-size:12px; background:#eef2ff; border:1px solid var(--bd);
    border-radius:999px; padding:2px 8px; color:#111827; white-space:nowrap;
  }

  /* カード */
  .card{
    position:relative; z-index:1;
    margin-top:28px;
    border:1px solid var(--bd); border-radius:10px; padding:10px 36px 10px 28px; background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .card .editBtn{
    position:absolute; right:6px; top:6px; border:1px solid var(--bd); background:#fff; border-radius:8px;
    padding:2px 8px; font-size:12px; cursor:pointer;
  }
  .title{ font-weight:600; margin-bottom:4px; padding-right:48px; }
  .meta{ color:var(--muted); font-size:12px; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{
    font-size:12px; border:1px solid var(--bd); border-radius:999px; padding:2px 8px; background:#f9fafb;
  }
  .pill.plan{ background:#f0fdf4; border-color:#bbf7d0; }
  .pill.today{ background:#fff7ed; border-color:#fed7aa; }
  .pill.actual{ background:#eef2ff; border-color:#c7d2fe; }
  .pill.remain{ background:#fef2f2; border-color:#fecaca; }

  .card.dragging{ opacity:.5 }
  .placeholder{ height:56px; margin-top:8px; border:2px dashed #93c5fd; border-radius:10px; background:#eff6ff; }

  /* トースト */
  .toast{
    position:fixed; right:12px; bottom:12px; z-index:200;
    background:#111827; color:#fff; padding:10px 14px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.18);
    display:none;
  }
  .toast.show{ display:block; }

  /* 通信中オーバーレイ */
  .overlay{
    position:fixed; inset:0; z-index:190; display:none; align-items:center; justify-content:center;
    background:rgba(255,255,255,.6); backdrop-filter:saturate(1.2) blur(1.5px);
  }
  .overlay.show{ display:flex; }
  .overlay .bubble{
    background:#111827; color:#fff; padding:14px 20px; border-radius:12px; box-shadow:0 8px 22px rgba(0,0,0,.25);
    font-weight:600;
  }
</style>
</head>
<body>
  <!-- ツールバー（横スクロールの外） -->
  <div class="toolbar">
    <label>開始日 <input type="date" id="start"></label>
    <label>日数
      <select id="days">
        <option>7</option><option selected>14</option><option>21</option><option>28</option><option>60</option>
      </select>
    </label>
    <button id="reload">更新</button>
    <div class="grow"></div>
    <span id="status" style="color:#6b7280"></span>
  </div>

  <!-- 横/縦スクロール領域 -->
  <div class="wrap">
    <div class="hscroll" id="scroller">
      <div class="dates" id="dates"></div>
      <div class="rows"  id="rows"></div>
    </div>
  </div>

  <div class="toast" id="toast">保存しました</div>
  <div class="overlay" id="overlay"><div class="bubble" id="overlayText">通信中…</div></div>

<script>
/* ====== ユーティリティ ====== */
const el = s=>document.querySelector(s);
const els = s=>Array.from(document.querySelectorAll(s));
const fmt = n => (n==null || n==='') ? '0' : Number(n).toFixed(2);
function showToast(msg){ const t=el('#toast'); t.textContent=msg||'保存しました'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1800); }
function showOverlay(text){ if(text) el('#overlayText').textContent=text; el('#overlay').classList.add('show'); }
function hideOverlay(){ el('#overlay').classList.remove('show'); }
function qp(){ const u=new URL(location.href); return { start: u.searchParams.get('start') || new Date().toISOString().slice(0,10), days: Math.max(1, Math.min(60, parseInt(u.searchParams.get('days')||14,10))) }; }
async function getJSON(url){ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); }

/* ====== データ ====== */
let users=[], dates=[], items=[];
let userMap=new Map(); // id -> name

/* ====== ヘッダ/行 ====== */
function buildHeaders(){
  const dWrap=el('#dates');
  dWrap.innerHTML='';
  dWrap.style.setProperty('--days', String(dates.length));
  const blank=document.createElement('div');
  blank.className='blank';
  blank.textContent='担当者 / 日付';
  dWrap.appendChild(blank);
  for(const d of dates){
    const box=document.createElement('div');
    box.className='dateHead';
    const w=d.weekday;
    if(w===0) box.classList.add('sun');
    if(w===6) box.classList.add('sat');
    const left=document.createElement('div');
    left.innerHTML=`<div class="d">${d.date}</div><div class="w">(${['日','月','火','水','木','金','土'][w]})</div>`;
    const right=document.createElement('div');
    right.className='sum';
    right.id = `sum-${d.date}`;
    right.textContent='計:0.00 / 予:0.00 / 実:0.00';
    box.append(left,right);
    dWrap.appendChild(box);
  }
}

function buildRows(){
  const rWrap=el('#rows');
  rWrap.innerHTML='';
  rWrap.style.setProperty('--days', String(dates.length));
  for(const u of users){
    const row=document.createElement('div');
    row.className='row';

    const name=document.createElement('div');
    name.className='name';
    name.innerHTML=`<div class="label">${u.name}</div><div class="tot" id="user-sum-${u.id}"></div>`;
    row.appendChild(name);

    for(const d of dates){
      const lane=document.createElement('div');
      lane.className='lane';
      lane.dataset.assignee=u.id;
      lane.dataset.date=d.date;

      const sum=document.createElement('div');
      sum.className='laneSum';
      sum.textContent='計:0.00 / 予:0.00 / 実:0.00';
      lane.appendChild(sum);

      row.appendChild(lane);
    }
    rWrap.appendChild(row);
  }
}

/* ====== カード生成/配置 ====== */
function makeCard(it){
  const card=document.createElement('div');
  card.className='card';
  card.setAttribute('draggable','true');
  card.dataset.id=it.id;
  card.dataset.order=String(it.order??0);
  card.dataset.assignee=it.assignee_id;
  card.dataset.date=it.date;

  const title = it.task || it.content || '(無題)';
  const customer = it.customer || '';
  const plan=fmt(it.plan), today=fmt(it.today_plan), actual=fmt(it.actual), remain=fmt(it.remaining);

  card.innerHTML=`
    <button class="editBtn" type="button">編集</button>
    <div class="title">${title}</div>
    <div class="meta">${customer}</div>
    <div class="pills">
      <span class="pill plan">計:${plan}</span>
      <span class="pill today">予:${today}</span>
      <span class="pill actual">実:${actual}</span>
      <span class="pill remain">残:${remain}</span>
    </div>
  `;
  card.querySelector('.editBtn').addEventListener('click', e=>{
    e.stopPropagation();
    alert('編集UIは既存のまま維持（本件は表示/固定のみの修正要求のため、機能は変更していません）');
  });
  card.addEventListener('dragstart', onCardDragStart);
  card.addEventListener('dragend', onCardDragEnd);
  return card;
}

function placeCards(){
  els('.lane').forEach(l=>{ [...l.querySelectorAll('.card')].forEach(c=>c.remove()); });

  const sorted=[...items].sort((a,b)=>{
    if(a.assignee_id!==b.assignee_id) return (a.assignee_id||'').localeCompare(b.assignee_id||'');
    if(a.date!==b.date) return (a.date||'').localeCompare(b.date||'');
    return (a.order??0)-(b.order??0);
  });

  for(const it of sorted){
    const lane=document.querySelector(`.lane[data-assignee="${it.assignee_id}"][data-date="${it.date}"]`);
    if(!lane) continue;
    lane.appendChild(makeCard(it));
  }

  enableLaneDnD();
  recalcSums();
}

/* ====== 集計 ====== */
function recalcSums(){
  const byDate=new Map(), byLane=new Map(), byUser=new Map();
  for(const it of items){
    const p=Number(it.plan||0), t=Number(it.today_plan||0), a=Number(it.actual||0);
    const dkey=it.date, lkey=`${it.assignee_id}|${it.date}`, ukey=it.assignee_id;

    const d=byDate.get(dkey)||{plan:0,today:0,actual:0}; d.plan+=p; d.today+=t; d.actual+=a; byDate.set(dkey,d);
    const l=byLane.get(lkey)||{plan:0,today:0,actual:0}; l.plan+=p; l.today+=t; l.actual+=a; byLane.set(lkey,l);
    const u=byUser.get(ukey)||{plan:0,today:0,actual:0}; u.plan+=p; u.today+=t; u.actual+=a; byUser.set(ukey,u);
  }
  // 日付ヘッダ
  dates.forEach(d=>{
    const s=byDate.get(d.date)||{plan:0,today:0,actual:0};
    const b=el(`#sum-${d.date}`); if(b) b.textContent=`計:${fmt(s.plan)} / 予:${fmt(s.today)} / 実:${fmt(s.actual)}`;
  });
  // 各マス／担当者合計
  users.forEach(u=>{
    const us=byUser.get(u.id)||{plan:0,today:0,actual:0};
    const lab=el(`#user-sum-${u.id}`); if(lab) lab.textContent=`計:${fmt(us.plan)} / 予:${fmt(us.today)} / 実:${fmt(us.actual)}`;
    dates.forEach(d=>{
      const key=`${u.id}|${d.date}`;
      const s=byLane.get(key)||{plan:0,today:0,actual:0};
      const lane=document.querySelector(`.lane[data-assignee="${u.id}"][data-date="${d.date}"]`);
      if(lane){ const badge=lane.querySelector('.laneSum'); if(badge) badge.textContent=`計:${fmt(s.plan)} / 予:${fmt(s.today)} / 実:${fmt(s.actual)}`; }
    });
  });
}

/* ====== DnD（カード移動のプレースホルダのみ維持） ====== */
let dragCard=null, placeholderEl=null;
function placeholder(){ if(!placeholderEl){ const ph=document.createElement('div'); ph.className='placeholder'; placeholderEl=ph; } return placeholderEl; }
function clearPlaceholder(){ if(placeholderEl?.parentNode) placeholderEl.parentNode.removeChild(placeholderEl); placeholderEl=null; }
function getInsertBefore(lane, mouseY){
  const cards=[...lane.querySelectorAll('.card:not(.dragging)')];
  for(const c of cards){ const r=c.getBoundingClientRect(); if(mouseY < r.top + r.height/2) return c; }
  return null;
}
function onCardDragStart(e){ dragCard=e.currentTarget; dragCard.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', dragCard.dataset.id||''); }
function onCardDragEnd(){ clearPlaceholder(); dragCard?.classList.remove('dragging'); dragCard=null; }
function enableLaneDnD(){
  els('.lane').forEach(lane=>{
    lane.addEventListener('dragover', e=>{
      if(!dragCard) return; e.preventDefault();
      const ph=placeholder();
      const before=getInsertBefore(lane, e.clientY);
      if(before) lane.insertBefore(ph, before); else lane.appendChild(ph);
    });
    lane.addEventListener('drop', e=>{
      e.preventDefault(); clearPlaceholder(); onCardDragEnd();
      // 本件は表示/固定の修正のみなので、サーバ更新は触りません
    });
  });
}

/* ====== 初期化 ====== */
async function bootstrap(){
  const q=qp();
  el('#start').value = q.start;
  el('#days').value  = String(q.days);

  showOverlay('読み込み中…');
  try{
    const [u, g] = await Promise.all([
      getJSON('/notion_users.php'),
      getJSON(`/notion_grid.php?start=${encodeURIComponent(q.start)}&days=${q.days}`)
    ]);

    // 担当者は“全員表示”優先：/notion_users.php と items に出る人の和集合
    const userMapById = new Map();
    (u.users||[]).forEach(x=>userMapById.set(x.id, {id:x.id, name:x.name}));
    (g.users||[]).forEach(x=>userMapById.set(x.id, {id:x.id, name:x.name}));
    (g.items||[]).forEach(it=>{
      if(it.assignee_id && !userMapById.has(it.assignee_id)){
        userMapById.set(it.assignee_id, {id:it.assignee_id, name:it.assignee_id});
      }
    });
    users = Array.from(userMapById.values());

    dates = g.dates || [];
    items = g.items || [];
    userMap = new Map(users.map(x=>[x.id, x.name]));

    buildHeaders();
    buildRows();
    placeCards();
  } finally {
    hideOverlay();
  }
}
el('#reload').addEventListener('click', ()=>{
  const start=el('#start').value || new Date().toISOString().slice(0,10);
  const days = parseInt(el('#days').value,10)||14;
  const url = new URL(location.href);
  url.searchParams.set('start', start);
  url.searchParams.set('days', String(days));
  location.href = url.toString();
});
bootstrap().catch(err=>{
  console.error(err);
  hideOverlay();
  alert('読み込みに失敗しました。/notion_users.php と /notion_grid.php を確認してください。');
});
</script>
</body>
</html>
