<!doctype html>
<meta charset="utf-8">
<title>Notion Board</title>
<style>
  :root { --cell-pad:8px; --gap:8px; --lane-h: 220px; --left-w: 220px; --hdr-h: 36px; }
  body { margin:0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif; }
  .topbar { padding:10px; display:flex; gap:8px; align-items:center; border-bottom:1px solid #eee; position:sticky; top:0; background:#fff; z-index:10; }
  input,select,button { padding:6px 8px; }
  .board { display:grid; grid-template-columns: var(--left-w) 1fr; }
  .dates { display:grid; grid-auto-flow:column; grid-auto-columns: 260px; position:sticky; top:36px; background:#fff; z-index:5; border-bottom:1px solid #eee; }
  .dateHdr { height:var(--hdr-h); display:flex; align-items:center; justify-content:center; border-left:1px solid #eee; border-right:1px solid #eee; font-weight:600; }
  .dateHdr.sat { background:#eef6ff; }
  .dateHdr.sun { background:#ffeef0; color:#c00; }
  .rows { display:grid; grid-auto-rows: minmax(var(--lane-h), auto); }
  .row { display:grid; grid-template-columns: var(--left-w) 1fr; border-bottom:1px solid #f1f1f1; }
  .userCell { border-right:1px solid #eee; padding:10px; display:flex; align-items:center; gap:8px; position:sticky; left:0; background:#fff; z-index:3; }
  .row-handle { cursor:grab; user-select:none; font-size:18px; line-height:1; opacity:.5; }
  .grid { display:grid; grid-auto-flow:column; grid-auto-columns: 260px; }
  .cell { border-left:1px solid #eee; border-right:1px solid #eee; padding:var(--cell-pad); position:relative; }
  .totals { position:absolute; top:4px; right:6px; font-size:12px; background:#fff; padding:2px 6px; border-radius:10px; border:1px solid #e5e5e5; }
  .lane { display:flex; flex-direction:column; gap:var(--gap); margin-top: 4px; padding-top: var(--hdr-h); }
  .card { border:1px solid #e5e5e5; border-radius:10px; padding:8px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.04); cursor:grab; }
  .dragging { opacity:.6; }
  .title { font-weight:600; margin-bottom:4px; }
  .sub { font-size:12px; color:#666; margin-bottom:6px; }
  .pills { display:flex; gap:6px; flex-wrap:wrap; }
  .pill { font-size:12px; border-radius:999px; padding:2px 8px; border:1px solid #e5e5e5; background:#fafafa; cursor:pointer; }
  .pill.editing { outline:2px solid #4098ff; background:#fff; }
  .drop-indicator { height:6px; margin:2px 0; border-radius:3px; background:#cfe3ff; display:none; }
  .lane.dragover .drop-indicator { display:block; }
  .saving { position:fixed; right:12px; bottom:12px; padding:8px 12px; background:#111; color:#fff; border-radius:8px; opacity:.9; display:none; }
  .saving.show { display:block; }
</style>
<div class="topbar">
  <label>開始日 <input type="date" id="start"></label>
  <label>日数
    <select id="days">
      <option>7</option><option selected>14</option><option>30</option><option>60</option>
    </select>
  </label>
  <button id="reload">再読込</button>
</div>
<div id="board" class="board"></div>
<div id="saving" class="saving">通信中…</div>

<script>
const $ = (s, el=document)=>el.querySelector(s);
const $$ = (s, el=document)=>Array.from(el.querySelectorAll(s));
const saving = $('#saving');

function showSaving(show){ saving.classList.toggle('show', !!show); }
function toastOk(){ saving.textContent='保存しました'; setTimeout(()=>saving.textContent='通信中…',1200); }

function fmtDateLabel(d, w){
  const ymd = d.replaceAll('-','/');
  const ww = ['日','月','火','水','木','金','土'][w];
  return `${ymd}（${ww}）`;
}

async function fetchGrid(start, days){
  const res = await fetch(`/notion_grid.php?start=${start}&days=${days}`);
  return res.json();
}

async function updateNotion(payload){
  const res = await fetch('/notion_update.php',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-HTTP-Method-Override':'PATCH'},
    body: JSON.stringify(payload)
  });
  let json={};
  try { json = await res.json(); } catch(_) {}
  if(json.status !== 200){
    console.warn('update failed', json);
    throw new Error('update failed');
  }
  return json;
}

/* -------------- render -------------- */
let STATE = { users:[], dates:[], items:[] };

function buildBoard(){
  const root = $('#board');
  root.innerHTML='';
  const leftCol = document.createElement('div');
  leftCol.style.position='sticky';
  leftCol.style.top='0';
  leftCol.style.background='#fff';
  leftCol.style.zIndex='5';
  // 日付ヘッダ
  const datesWrap = document.createElement('div');
  datesWrap.className='dates';
  datesWrap.style.gridColumn='2 / span 1';
  STATE.dates.forEach(d=>{
    const h = document.createElement('div');
    h.className='dateHdr ' + (d.weekday===6?'sat':(d.weekday===0?'sun':'')); // 土:青, 日:赤
    h.textContent = fmtDateLabel(d.date, d.weekday);
    datesWrap.appendChild(h);
  });

  // 行（担当者）
  const rowsWrap = document.createElement('div'); rowsWrap.className='rows';
  const order = loadRowOrder(STATE.users.map(u=>u.id));
  const usersSorted = order.map(id => STATE.users.find(u=>u.id===id)).filter(Boolean);

  for(const user of usersSorted){
    const row = document.createElement('div'); row.className='row'; row.dataset.userId=user.id;

    // 左セル（担当者名＋行ハンドル）
    const ucell = document.createElement('div'); ucell.className='userCell';
    const grip = document.createElement('span'); grip.className='row-handle'; grip.textContent='≡';
    grip.title='ドラッグして担当者の行順を変更';
    grip.draggable=true;
    grip.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/row-id', user.id);
      e.dataTransfer.effectAllowed='move';
    });
    ucell.appendChild(grip);

    const uname = document.createElement('div');
    uname.textContent = user.name || user.id;
    ucell.appendChild(uname);
    row.appendChild(ucell);

    // 右側のグリッド（各日付セル）
    const grid = document.createElement('div'); grid.className='grid';
    for(const d of STATE.dates){
      const cell = document.createElement('div'); cell.className='cell'; cell.dataset.date=d.date;
      // totals
      const totals = document.createElement('div'); totals.className='totals'; totals.textContent='-/-/-';
      cell.appendChild(totals);
      // lane
      const lane = document.createElement('div'); lane.className='lane'; lane.dataset.userId=user.id; lane.dataset.date=d.date;
      const di = document.createElement('div'); di.className='drop-indicator'; lane.appendChild(di);

      // items
      const items = STATE.items
        .filter(it=>it.assignee_id===user.id && it.date===d.date)
        .sort((a,b)=>(a.order||0)-(b.order||0));
      for(const it of items){
        lane.appendChild(buildCard(it));
      }
      updateTotals(cell);

      enableLaneDnD(lane); // ドロップで入替/移動
      cell.appendChild(lane);
      grid.appendChild(cell);
    }
    row.appendChild(grid);
    rowsWrap.appendChild(row);
  }

  // 行並べ替え drop
  rowsWrap.addEventListener('dragover', e=>{
    if(!e.dataTransfer.types.includes('text/row-id')) return;
    e.preventDefault();
  });
  rowsWrap.addEventListener('drop', e=>{
    const id = e.dataTransfer.getData('text/row-id');
    const rows = $$('.row', rowsWrap);
    let target = e.target.closest('.row');
    if(!target){ return; }
    const dragging = rows.find(r=>r.dataset.userId===id);
    if(!dragging || dragging===target) return;
    const rect = target.getBoundingClientRect();
    const before = (e.clientY < rect.top + rect.height/2);
    rowsWrap.insertBefore(dragging, before ? target : target.nextSibling);
    saveRowOrder($$('.row', rowsWrap).map(r=>r.dataset.userId));
  });

  root.appendChild(leftCol);
  root.appendChild(datesWrap);
  root.appendChild(rowsWrap);
}

function buildCard(it){
  const el = document.createElement('div'); el.className='card'; el.draggable=true;
  el.dataset.id=it.id; el.dataset.order=it.order||0;
  el.innerHTML = `
    <div class="title">${escapeHtml(it.task || '(無題)')}</div>
    <div class="sub">${escapeHtml(it.customer || '')}　${escapeHtml(it.content || '')}</div>
    <div class="pills">
      <span class="pill" data-field="plan"       title="計画を編集">${fmtNum(it.plan)}</span>
      <span class="pill" data-field="today_plan" title="当日予定を編集">${fmtNum(it.today_plan)}</span>
      <span class="pill" data-field="actual"     title="実績を編集">${fmtNum(it.actual)}</span>
    </div>
  `;
  // pill クリック編集
  $$('.pill', el).forEach(p=>{
    p.addEventListener('click', async ()=>{
      const field = p.dataset.field;
      const curr = p.textContent.trim();
      const next = prompt(`「${labelOf(field)}」を入力（空でクリア）`, curr===''?'':curr);
      if(next===null) return;
      let num = next.trim()==='' ? null : Number(next);
      if(next.trim()!=='' && Number.isNaN(num)){ alert('数値を入力してください'); return; }
      try{
        showSaving(true);
        await updateNotion({ id: el.dataset.id, [field]: num });
        p.textContent = fmtNum(num);
        updateTotals(el.closest('.cell'));
        toastOk();
      }catch(e){ alert('保存に失敗しました'); }
      finally{ showSaving(false); }
    });
  });
  enableCardDnD(el);
  return el;
}

function updateTotals(cell){
  const cards = $$('.card', cell);
  let sPlan=0, sToday=0, sActual=0;
  for(const c of cards){
    sPlan  += parseFloat($('[data-field="plan"]', c)?.textContent||0)    || 0;
    sToday += parseFloat($('[data-field="today_plan"]', c)?.textContent||0)|| 0;
    sActual+= parseFloat($('[data-field="actual"]', c)?.textContent||0)  || 0;
  }
  $('.totals', cell).textContent = `計:${round1(sPlan)} / 予:${round1(sToday)} / 実:${round1(sActual)}`;
}

function fmtNum(v){ return (v===null||v===undefined||v==='')?'':(Math.round(Number(v)*10)/10).toString(); }
function round1(v){ return Math.round(v*10)/10; }
function labelOf(field){ return field==='plan'?'計画':(field==='today_plan'?'当日予定':'実績'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

/* -------------- DnD (カード) -------------- */
function enableCardDnD(card){
  card.addEventListener('dragstart', e=>{
    card.classList.add('dragging');
    e.dataTransfer.setData('text/card-id', card.dataset.id);
    e.dataTransfer.effectAllowed='move';
  });
  card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
}
function enableLaneDnD(lane){
  lane.addEventListener('dragover', e=>{
    if(!e.dataTransfer.types.includes('text/card-id')) return;
    e.preventDefault();
    const after = getDragAfterElement(lane, e.clientY);
    lane.classList.add('dragover');
    if(after==null) lane.appendChild($('.drop-indicator', lane));
    else lane.insertBefore($('.drop-indicator', lane), after);
  });
  lane.addEventListener('dragleave', ()=> lane.classList.remove('dragover'));
  lane.addEventListener('drop', async e=>{
    const id = e.dataTransfer.getData('text/card-id');
    const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    const after = getDragAfterElement(lane, e.clientY);
    if(after==null) lane.appendChild(card); else lane.insertBefore(card, after);
    lane.classList.remove('dragover');
    $('.drop-indicator', lane).remove();

    // 並び直し → order を10刻みで振り直し、移動カードは date/assignee も更新
    const cards = $$('.card', lane);
    const updates = [];
    cards.forEach((c, i)=>{
      const newOrder = (i+1)*10;
      if(Number(c.dataset.order)!==newOrder){
        c.dataset.order = newOrder;
        const payload = { id: c.dataset.id, order: newOrder };
        if(c===card){ // 移動したカードは 対象セルの担当者/日付も更新
          payload.assignee_id = lane.dataset.userId;
          payload.date        = lane.dataset.date;
        }
        updates.push(payload);
      }else if(c===card){
        // order同じでもセル移動のみのケースをケア
        updates.push({ id: c.dataset.id, assignee_id: lane.dataset.userId, date: lane.dataset.date });
      }
    });
    try{
      showSaving(true);
      for(const u of updates) await updateNotion(u);
      // 合計再計算（元セル/先セル）
      updateTotals(lane);
      const prevCell = card._prevCell || null;
      if(prevCell && prevCell!==lane) updateTotals(prevCell);
      toastOk();
    }catch(e){ alert('更新に失敗しました'); }
    finally{ showSaving(false); card._prevCell=null; }
  });
  // ドラッグ開始時に元セル保存
  lane.addEventListener('dragstart', e=>{
    const id = e.target?.closest?.('.card')?.dataset?.id;
    if(id){
      const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
      if(el) el._prevCell = el.closest('.lane');
    }
  }, true);
}
function getDragAfterElement(container, y){
  const els = $$('.card', container).filter(e=>!e.classList.contains('dragging'));
  let closest = null; let closestOff = Number.NEGATIVE_INFINITY;
  for(const el of els){
    const box = el.getBoundingClientRect();
    const off = y - box.top - box.height/2;
    if(off<0 && off>closestOff){ closestOff=off; closest=el; }
  }
  return closest;
}

/* -------------- Row order (担当者順) -------------- */
function loadRowOrder(defaultIds){
  const saved = localStorage.getItem('rowOrder');
  if(!saved) return defaultIds;
  const arr = JSON.parse(saved);
  // defaultに無いidを削除、足りないidを末尾追加
  const filtered = arr.filter(id=>defaultIds.includes(id));
  for(const id of defaultIds) if(!filtered.includes(id)) filtered.push(id);
  return filtered;
}
function saveRowOrder(ids){ localStorage.setItem('rowOrder', JSON.stringify(ids)); }

/* -------------- boot -------------- */
(async function(){
  // UI
  const start = $('#start'); const days = $('#days'); const reloadBtn = $('#reload');
  const today = new Date().toISOString().slice(0,10);
  start.value = new URL(location.href).searchParams.get('start') || today;
  days.value  = new URL(location.href).searchParams.get('days')  || '14';

  async function reload(){
    const s = start.value; const d = days.value;
    history.replaceState(null,'', `?start=${s}&days=${d}`);
    showSaving(true);
    try{
      const data = await fetchGrid(s, d);
      STATE = data;
      buildBoard();
    }finally{ showSaving(false); }
  }
  reloadBtn.addEventListener('click', reload);
  await reload();
})();
</script>
