<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>カードボード</title>
<style>
:root{
  --bd:#e5e7eb;
  --muted:#6b7280;
  --bg:#f8fafc;
  --sat:#e8f2ff;
  --sun:#ffe8e8;
  --holiday:#ffe8f0;
  --accent:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#111}
body{font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif}

header{
  display:flex; align-items:center; gap:.5rem;
  padding:.6rem .8rem; border-bottom:1px solid var(--bd); background:#fff; position:sticky; top:0; z-index:3;
}
header .btn{border:1px solid var(--bd); background:#fff; padding:.3rem .5rem; border-radius:.4rem; cursor:pointer}
header .btn:disabled{opacity:.5; cursor:not-allowed}
header .sep{flex:1}

#board{overflow:auto}

.grid{
  display:grid;
  grid-auto-rows:minmax(64px,auto);
}
.grid.compact .lane{min-height:44px}
.th{
  position:sticky; left:0; z-index:2; background:#fff; border-right:1px solid var(--bd);
}
.cell{
  border-right:1px solid var(--bd);
  border-bottom:1px solid var(--bd);
  background:#fff;
}
.cell.lane{
  min-height:64px; position:relative; padding:6px; background:#fff;
}
.cell.lane.sat{background:var(--sat)}
.cell.lane.sun{background:var(--sun)}
.cell.lane.holiday{background:var(--holiday)}
.cell.th.date{position:sticky; top:41px; z-index:1; text-align:center; background:#fff}
.cell.th.assignee{display:flex; align-items:center; gap:.4rem; padding:6px; font-weight:600}

.datebox{display:flex; flex-direction:column; gap:2px; padding:6px 0}
.datebox .d{font-weight:700}
.datebox .w{font-size:12px; color:var(--muted)}

.card{
  background:#fff; border:1px solid var(--bd); border-radius:.5rem; padding:.5rem .55rem; margin:.35rem 0;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
  cursor:grab; user-select:none;
}
.card:active{cursor:grabbing}
.card .meta{font-size:12px; color:var(--muted)}
.card .title{font-weight:600; margin:.15rem 0 .2rem}
.pill{
  display:inline-block; border:1px solid var(--bd);
  border-radius:999px; padding:2px 8px; font-size:12px; margin-right:6px; background:#fafafa;
}
.pill.editable{cursor:pointer}
.ghost{opacity:.4; outline:2px dashed #a3a3a3; outline-offset:4px}
.dropping{box-shadow: inset 0 0 0 2px #60a5fa}

#loading{position:fixed; inset:0; background:rgba(255,255,255,.45); display:none; z-index:5}
#loading .box{
  position:absolute; left:50%; top:56%; transform:translate(-50%,-50%);
  background:#fff; border:1px solid var(--bd); border-radius:.5rem; padding:10px 16px; font-size:13px;
}
#status{
  position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
  background:#111; color:#fff; padding:6px 12px; border-radius:8px; font-size:12px; opacity:0; transition:.2s;
}
#status.show{opacity:1}
</style>
</head>
<body>
<header>
  <button class="btn" id="prev">«</button>
  <input id="start" type="date" />
  <button class="btn" id="next">»</button>
  <select id="days">
    <option>7</option><option selected>14</option><option>21</option><option>28</option><option value="60">60</option>
  </select>
  <label style="display:inline-flex;align-items:center;gap:.4rem;margin-left:.6rem;">
    <input type="checkbox" id="compact" /> コンパクト
  </label>
  <span class="sep"></span>
</header>

<div id="board">
  <div id="grid" class="grid"></div>
</div>

<div id="loading"><div class="box">通信中…</div></div>
<div id="status"></div>

<script>
/* ========= ユーティリティ ========= */
const el = (sel,root=document)=>root.querySelector(sel);
const els = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
const fmt = (d)=>new Date(d).toISOString().slice(0,10);
const WEEK = ['日','月','火','水','木','金','土'];
const API = {
  USERS:'/notion_users.php',
  GRID:'/notion_grid.php',
  UPDATE:'/notion_update.php'
};
const Loading = {
  show(){ el('#loading').style.display='block'; },
  hide(){ el('#loading').style.display='none'; }
};
function msg(t){ const s=el('#status'); s.textContent=t; s.classList.add('show'); setTimeout(()=>s.classList.remove('show'), 1800); }

let users = [];   // {id,name}
let dates = [];   // {date, weekday, is_holiday}
let cards = [];   // items

/* ========= レンダリング ========= */
function buildGrid(){
  const grid = el('#grid');
  grid.innerHTML = '';

  const cols = 1 + dates.length; // 1列目は担当者
  grid.style.gridTemplateColumns = `220px repeat(${dates.length}, minmax(240px, 1fr))`;

  // ヘッダ1行目（左上の空白セル）
  const corner = document.createElement('div');
  corner.className='cell th';
  grid.appendChild(corner);

  // 日付ヘッダ
  for(const d of dates){
    const c = document.createElement('div');
    c.className = 'cell th date';
    const w = WEEK[d.weekday];
    c.innerHTML = `<div class="datebox"><div class="d">${d.date}</div><div class="w">${w}${d.is_holiday?'・祝':''}</div></div>`;
    grid.appendChild(c);
  }

  // 各担当者の行
  for(const u of users){
    // 左端見出し
    const th = document.createElement('div');
    th.className = 'cell th assignee';
    th.textContent = u.name || '(無名)';
    grid.appendChild(th);

    // 日毎のレーン
    for(const d of dates){
      const lane = document.createElement('div');
      lane.className = 'cell lane';
      lane.dataset.assigneeId = u.id || '';
      lane.dataset.date = d.date;
      lane.dataset.weekday = d.weekday;
      if(d.weekday==6) lane.classList.add('sat');
      if(d.weekday==0) lane.classList.add('sun');
      if(d.is_holiday) lane.classList.add('holiday');
      grid.appendChild(lane);
    }
  }

  // カード描画
  for(const item of cards){
    const lane = findLane(item.assignee_id, item.date);
    if(!lane) continue;
    lane.appendChild(cardEl(item));
  }

  // 並び順ソート
  els('.lane').forEach(sortLane);
  // コンパクト
  el('#grid').classList.toggle('compact', el('#compact').checked);
}

function cardEl(item){
  const div = document.createElement('div');
  div.className = 'card';
  div.draggable = true;
  div.dataset.id = item.id;
  div.dataset.order = item.order ?? 0;

  const cust = item.customer || '';
  const task = item.task || '';
  const cont = item.content || '';

  const plan = (item.today_plan ?? '');
  const actual = (item.actual ?? '');

  div.innerHTML = `
    <div class="meta">${cust ? cust : ''}</div>
    <div class="title">${task ? task : cont}</div>
    <div>
      <span class="pill editable" data-edit="plan"   data-value="${plan}">当日予定: ${plan === '' ? '-' : plan}</span>
      <span class="pill editable" data-edit="actual" data-value="${actual}">実績: ${actual === '' ? '-' : actual}</span>
    </div>
  `;
  return div;
}

/* ========= データ取得 ========= */
async function reload(){
  try{
    Loading.show();
    const start = el('#start').value || fmt(new Date());
    const days  = Number(el('#days').value || 14);

    // ユーザー
    const ures = await fetch(API.USERS);
    const ujs = await ures.json();
    users = (ujs.users || []).filter(x=>x && x.name);

    // グリッド（dates + items）
    const gres = await fetch(`${API.GRID}?start=${encodeURIComponent(start)}&days=${days}`);
    const gjs = await gres.json();
    dates = gjs.dates || [];
    cards = gjs.items || [];

    buildGrid();
  }catch(err){
    console.error(err);
    alert('読み込みに失敗しました');
  }finally{
    Loading.hide();
  }
}

/* ========= レーン/並び ========= */
function findLane(assigneeId, date){
  return el(`.lane[data-assignee-id="${css(assigneeId||'')}"][data-date="${css(date)}"]`);
}
function css(s){ return String(s).replace(/"/g,'\\"'); }

function sortLane(lane){
  const children = els('.card', lane)
    .sort((a,b)=> Number(a.dataset.order||0) - Number(b.dataset.order||0));
  children.forEach(ch=> lane.appendChild(ch));
}

/* ========= DnD ========= */
let dragData = null;

document.addEventListener('dragstart', (e)=>{
  const card = e.target.closest('.card'); if(!card) return;
  dragData = {
    id: card.dataset.id,
    fromLane: card.closest('.lane')
  };
  card.classList.add('ghost');
  e.dataTransfer.setData('text/plain', card.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
});

document.addEventListener('dragend', (e)=>{
  const card = e.target.closest('.card'); if(card) card.classList.remove('ghost');
  dragData = null;
  els('.lane').forEach(l=>l.classList.remove('dropping'));
});

document.addEventListener('dragover', (e)=>{
  const lane = e.target.closest('.lane'); if(!lane || !dragData) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  lane.classList.add('dropping');

  const card = el(`.card[data-id="${dragData.id}"]`);
  if(!card) return;

  const before = findBeforeNode(lane, e.clientY);
  if(before === null){ lane.appendChild(card); }
  else if(before !== card){ lane.insertBefore(card, before); }
});

document.addEventListener('dragleave', (e)=>{
  const lane = e.target.closest('.lane'); if(!lane) return;
  lane.classList.remove('dropping');
});

document.addEventListener('drop', async (e)=>{
  const lane = e.target.closest('.lane'); if(!lane || !dragData) return;
  e.preventDefault(); lane.classList.remove('dropping');

  const card = el(`.card[data-id="${dragData.id}"]`); if(!card) return;

  // 新しい order を決める
  const before = findBeforeNode(lane, e.clientY);
  const children = els('.card', lane);
  let newOrder = 10;
  if(children.length===1){
    newOrder = 10;
  }else if(before===null){
    const last = children[children.length-1];
    newOrder = Number(last.dataset.order||0) + 10;
  }else{
    const idx = children.indexOf(before);
    const prev = children[idx-1] || null;
    const a = prev? Number(prev.dataset.order||0) : 0;
    const b = Number(before.dataset.order||0);
    newOrder = Math.floor((a+b)/2) || (b-1);
  }
  card.dataset.order = newOrder;

  // サーバ更新
  const assignee_id = lane.dataset.assigneeId || null;
  const date = lane.dataset.date;
  await patchCard({ id: dragData.id, assignee_id, date, order:newOrder });
  msg('✔ 移動しました');
});

function findBeforeNode(lane, mouseY){
  const cards = els('.card', lane);
  let before = null;
  for(const ch of cards){
    const r = ch.getBoundingClientRect();
    const middle = r.top + r.height/2;
    if(mouseY < middle){ before = ch; break; }
  }
  return before; // null のときは末尾
}

/* ========= 更新（クリック編集もここへ） ========= */
async function patchCard(payload){
  try{
    Loading.show();
    const res = await fetch(API.UPDATE, {
      method:'POST',
      headers:{'Content-Type':'application/json','X-HTTP-Method-Override':'PATCH'},
      body: JSON.stringify(payload)
    });
    const js = await res.json().catch(()=> ({}));
    if(!res.ok || (js.status && js.status!==200)){
      console.warn(js);
      alert(`保存に失敗しました（${js.status||res.status}）`);
      return {ok:false, js};
    }
    return {ok:true, js};
  }finally{
    Loading.hide();
  }
}

/* クリック編集（当日予定/実績） */
document.addEventListener('click', async (e)=>{
  const elPill = e.target.closest('.editable[data-edit]'); if(!elPill) return;
  const card = e.target.closest('.card'); if(!card) return;

  const id = card.dataset.id;
  const field = elPill.dataset.edit; // 'plan' | 'actual'
  const label = field==='plan' ? '当日予定' : '実績';
  const cur = elPill.dataset.value ?? '';

  const v = prompt(`${label} を入力してください（空でクリア）`, cur);
  if(v===null) return;

  const num = (v==='' ? null : Number(v));
  if(v!=='' && Number.isNaN(num)){ alert('数値で入力してください'); return; }

  const payload = { id };
  if(field==='plan') payload.today_plan = num; else payload.actual = num;

  const r = await patchCard(payload);
  if(r.ok){
    elPill.dataset.value = (v==='' ? '' : String(num));
    elPill.textContent = `${label}: ${v==='' ? '-' : num}`;
    msg('✔ 保存しました');
  }
});

/* ========= コントロール ========= */
el('#prev').addEventListener('click', ()=>{
  const d = new Date(el('#start').value || Date.now());
  d.setDate(d.getDate()-Number(el('#days').value||14));
  el('#start').value = fmt(d); reload();
});
el('#next').addEventListener('click', ()=>{
  const d = new Date(el('#start').value || Date.now());
  d.setDate(d.getDate()+Number(el('#days').value||14));
  el('#start').value = fmt(d); reload();
});
el('#days').addEventListener('change', reload);
el('#start').addEventListener('change', reload);
el('#compact').addEventListener('change', ()=> el('#grid').classList.toggle('compact', el('#compact').checked));

/* ========= 初期化 ========= */
(function init(){
  const t = new Date();
  el('#start').value = fmt(t);
  reload();
})();
</script>
</body>
</html>
