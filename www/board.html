<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surplus Board</title>
<style>
  :root{
    --left: 220px;         /* 左の担当者列の幅 */
    --col: 300px;          /* 日付列の幅 */
    --gap: 8px;
    --bd:#d1d5db;
    --muted:#6b7280;
    --toolbarH: 48px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", Helvetica, Arial}

  /* ツールバー（横スクロールしても固定） */
  .toolbar{
    position: fixed; left:0; right:0;
    top:0; z-index:60;
    display:flex; gap:8px; align-items:center;
    padding:10px 12px; background:#fff; border-bottom:1px solid var(--bd);
    height: var(--toolbarH);
  }
  .toolbar input, .toolbar select, .toolbar button{
    padding:6px 10px; border:1px solid var(--bd); border-radius:8px; background:#fff;
  }
  .toolbar .grow{flex:1}

  .wrap{
    padding:8px;
    position: absolute; top: calc(var(--toolbarH) + 1px); bottom:0; left:0; right:0;
    width: calc(var(--days) * var(--col) + var(--left) + (var(--days) - 1) * var(--gap) + 16px);
  }

  /* 日付ヘッダ（固定） */
  .dates{
    position: sticky; top: calc(var(--toolbarH)); z-index:50; background:#fff; border-bottom:1px solid var(--bd);
    display:grid; grid-template-columns: var(--left) repeat(var(--days), var(--col));
    gap: var(--gap);
    pointer-events: none;
  }
  .dates .blank{
    position:sticky; left:0; z-index:51; background:#fff; border-right:1px solid var(--bd); pointer-events:auto;
    display:flex; align-items:center; padding:8px 10px; font-weight:600;
  }
  .dateHead{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border-left:1px dashed var(--bd);
  }
  .dateHead .d{ font-weight:600; }
  .dateHead .w{ color:var(--muted); font-size:12px; }
  .dateHead.sun .d, .dateHead.sun .w{ color:#dc2626; }
  .dateHead.sat .d, .dateHead.sat .w{ color:#2563eb; }
  .dateHead .sum{
    font-size:12px; background:#f3f4f6; border:1px solid var(--bd); border-radius:999px; padding:2px 8px;
  }

  /* 行（担当者ごと） */
  .rows{ display:flex; flex-direction:column; gap:var(--gap); padding-top:6px; }
  .row{
    display:grid; grid-template-columns: var(--left) repeat(var(--days), var(--col));
    gap: var(--gap);
    align-items: stretch;
    border-top:1px solid var(--bd);   /* 行の上線 */
  }

  /* 左：担当者（横書きに変更、上下ボタンは廃止） */
  .name{
    position: sticky; left:0; z-index:30; background:#fff;
    padding:10px 10px 6px; border-right:1px solid var(--bd); min-height:48px;
    display:flex; flex-direction:column; align-items:flex-start; gap:4px;
  }
  .name .label{ font-weight:700; }
  .name .tot{ font-size:12px; color:var(--muted); }

  /* 各マス */
  .lane{
    position:relative;
    min-height:140px; padding:8px; border:1px solid var(--bd); border-radius:10px; background:#fff;
  }
  .laneSum{
    position:absolute; top:6px; right:8px;
    font-size:12px; background:#eef2ff; border:1px solid var(--bd);
    border-radius:999px; padding:2px 8px; color:#111827; white-space:nowrap;
  }

  /* カード */
  .card{
    position:relative; margin-top:28px;
    border:1px solid var(--bd); border-radius:10px; padding:10px 36px 10px 28px; background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .card .handle{
    position:absolute; left:6px; top:8px; cursor:grab; user-select:none; color:#6b7280;
  }
  .card .editBtn{
    position:absolute; right:6px; top:6px; border:1px solid var(--bd); background:#fff; border-radius:8px;
    padding:2px 8px; font-size:12px; cursor:pointer;
  }
  .title{ font-weight:600; margin-bottom:4px; padding-right:48px; }
  .meta{ color:var(--muted); font-size:12px; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{
    font-size:12px; border:1px solid var(--bd); border-radius:999px; padding:2px 8px; background:#f9fafb;
  }
  .pill.plan{ background:#f0fdf4; border-color:#bbf7d0; }
  .pill.today{ background:#fff7ed; border-color:#fed7aa; }
  .pill.actual{ background:#eef2ff; border-color:#c7d2fe; }
  .pill.remain{ background:#fef2f2; border-color:#fecaca; }
  .pill.contract{ background:#ecfeff; border-color:#a5f3fc; } /* 契約納期用（将来の拡張向け） */
  .pill.promised_date{ background:#ecfeff; border-color:#a5f3fc; } /* 契約納期用 */

  .card.dragging{ opacity:.5 }
  .placeholder{ height:56px; margin-top:8px; border:2px dashed #93c5fd; border-radius:10px; background:#eff6ff; }

  /* トースト */
  .toast{
    position:fixed; right:12px; bottom:12px; z-index:80;
    background:#111827; color:#fff; padding:10px 14px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.18);
    display:none;
  }
  .toast.show{ display:block; }

  /* 通信中オーバーレイ */
  .overlay{
    position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center;
    background:rgba(255,255,255,.6); backdrop-filter:saturate(1.2) blur(1.5px);
  }
  .overlay.show{ display:flex; }
  .overlay .bubble{
    background:#111827; color:#fff; padding:14px 20px; border-radius:12px; box-shadow:0 8px 22px rgba(0,0,0,.25);
    font-weight:600;
  }

  /* 編集モーダル */
  .modal{ position:fixed; inset:0; z-index:85; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.25); }
  .modal.show{ display:flex; }
  .panel{
    width:min(420px,92vw); background:#fff; border-radius:14px; border:1px solid var(--bd); padding:14px;
  }
  .panel h3{ margin:0 0 10px 0; }
  .form{ display:flex; flex-direction:column; gap:10px; }
  .form label{ font-size:12px; color:var(--muted); }
  .form input, .form select{ width:100%; padding:8px 10px; border:1px solid var(--bd); border-radius:8px; }
  .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .btn{ padding:8px 12px; border:1px solid var(--bd); border-radius:8px; background:#fff; cursor:pointer; }
  .btn.primary{ background:#2563eb; color:#fff; border-color:#2563eb; }

  /* 並び替えモーダル（チェックで非表示） */
  .uList{ list-style:none; margin:0; padding:0; }
  .uList li{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border:1px solid var(--bd); border-radius:8px; background:#fff; margin-bottom:8px;
  }
  .uList li .drag{ cursor:grab; color:#6b7280; }
  .uList li[draggable="true"]{ user-select:none; }
  .uList .ghost{ opacity:.5; }
</style>
</head>
<body>
  <div class="toolbar">
    <label>開始日 <input type="date" id="start"></label>
    <label>日数
      <select id="days">
        <option>7</option><option selected>14</option><option>21</option><option>28</option><option>60</option>
      </select>
    </label>
    <button class="btn" id="reload">更新</button>
    <button class="btn" id="openReorder">担当者並び替え…</button>
    <div class="grow"></div>
    <span id="status" style="color:#6b7280"></span>
  </div>

  <div class="wrap">
    <div class="dates" id="dates"></div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="toast" id="toast">保存しました</div>
  <div class="overlay" id="overlay"><div class="bubble" id="overlayText">通信中…</div></div>

  <!-- 編集モーダル（縦並び） -->
  <div class="modal" id="modal">
    <div class="panel">
      <h3>カードを編集</h3>
      <div class="form">
        <div>
          <label for="f_date">日付</label>
          <input type="date" id="f_date">
        </div>
        <div>
          <label for="f_assignee">担当者</label>
          <select id="f_assignee"></select>
        </div>
        <div>
          <label for="f_plan">計画</label>
          <input type="number" step="0.25" id="f_plan">
        </div>
        <div>
          <label for="f_today">当日予定</label>
          <input type="number" step="0.25" id="f_today">
        </div>
        <div>
          <label for="f_actual">実績</label>
          <input type="number" step="0.25" id="f_actual">
        </div>
        <div>
          <label for="f_remain">残時間</label>
          <input type="number" step="0.25" id="f_remain">
        </div>
        <div>
          <label for="f_promised_date">顧客と約束した納期</label>
          <input type="date" id="f_promised_date">
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="cancel">キャンセル</button>
        <button class="btn primary" id="save">保存</button>
      </div>
    </div>
  </div>

  <!-- 担当者 並び替え/非表示モーダル -->
  <div class="modal" id="reorderModal">
    <div class="panel">
      <h3>担当者の並び替え / 非表示</h3>
      <ul class="uList" id="uList"></ul>
      <div class="actions">
        <button class="btn" id="reorderCancel">閉じる</button>
        <button class="btn primary" id="reorderSave">保存</button>
      </div>
    </div>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const days = parseInt(el('#days').value,10)||14;
    const oneboxwidth = 300 + 8; // マス幅 + gap
    document.querySelector('.wrap').style.width = days * oneboxwidth + 220 + 'px'; // マス幅×日数 + 左列幅

  });
/* ====== ユーティリティ ====== */
const el = s=>document.querySelector(s);
const els = s=>Array.from(document.querySelectorAll(s));
const fmt = n => (n==null || n==='') ? '0' : Number(n).toFixed(2);

function showToast(msg){
  const t=el('#toast'); t.textContent=msg||'保存しました';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1800);
}
function showOverlay(text){
  if(text) el('#overlayText').textContent = text;
  el('#overlay').classList.add('show');
}
function hideOverlay(){
  el('#overlay').classList.remove('show');
}

function queryParams(){
  const u=new URL(location.href);
  return {
    start: u.searchParams.get('start') || new Date().toISOString().slice(0,10),
    days:  Math.max(1, Math.min(60, parseInt(u.searchParams.get('days')||14,10)))
  };
}
async function getJSON(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}
const storageKey = (name)=>`surplus_${name}`;

/* ====== データ ====== */
let users=[], dates=[], items=[];
let userMap=new Map(); // id -> name

/* ====== ヘッダ/行構築 ====== */
function buildHeaders(){
  const dWrap=el('#dates');
  dWrap.innerHTML='';
  dWrap.style.setProperty('--days', String(dates.length));

  const blank=document.createElement('div');
  blank.className='blank';
  blank.textContent='担当者 / 日付';
  dWrap.appendChild(blank);

  for(const d of dates){
    const box=document.createElement('div');
    box.className='dateHead';
    const w=d.weekday;
    if(w===0) box.classList.add('sun');
    if(w===6) box.classList.add('sat');
    const left=document.createElement('div');
    left.innerHTML=`<div class="d">${d.date}</div><div class="w">(${['日','月','火','水','木','金','土'][w]})</div>`;
    const right=document.createElement('div');
    right.className='sum';
    right.id = `sum-${d.date}`;
    right.textContent='計:0.00 / 予:0.00 / 実:0.00';
    box.append(left,right);
    dWrap.appendChild(box);
  }
}

function buildRows(){
  const rWrap=el('#rows');
  rWrap.innerHTML='';
  rWrap.style.setProperty('--days', String(dates.length));

  const hidden = loadUserHidden(); // Set<id>

  for(let i=0;i<users.length;i++){
    const u=users[i];
    if(hidden.has(u.id)) continue;

    const row=document.createElement('div');
    row.className='row';

    // 左：担当者（横書き、上下ボタン廃止）
    const name=document.createElement('div');
    name.className='name';
    name.innerHTML=`
      <div class="label">${u.name}</div>
      <div class="tot" id="user-sum-${u.id}">計:0.00 / 予:0.00 / 実:0.00</div>
    `;
    row.appendChild(name);

    // 各マス
    for(const d of dates){
      const lane=document.createElement('div');
      lane.className='lane';
      lane.dataset.assignee=u.id;
      lane.dataset.date=d.date;

      const sum=document.createElement('div');
      sum.className='laneSum';
      sum.textContent='計:0.00 / 予:0.00 / 実:0.00';
      lane.appendChild(sum);

      row.appendChild(lane);
    }
    rWrap.appendChild(row);
  }

  document.querySelector('.wrap').style.height = rWrap.clientHeight + 16 + 'px'; // 行数×行高さ + padding
}

/* ====== カード ====== */
function makeCard(it){
  const card=document.createElement('div');
  card.className='card';
  card.setAttribute('draggable','true');
  card.dataset.id=it.id;
  card.dataset.order=String(it.order??0);
  card.dataset.assignee=it.assignee_id;
  card.dataset.date=it.date;

  const title = it.task || it.content || '(無題)';
  const customer = it.customer || '';
  const plan=fmt(it.plan), today=fmt(it.today_plan), actual=fmt(it.actual), remain=fmt(it.remaining), promised_date=it.promised_date ? it.promised_date : '';

  card.innerHTML=`
    <div class="handle" title="ドラッグ">≡</div>
    <button class="editBtn" type="button">編集</button>
    <div class="title">${title}</div>
    <div class="meta">${customer}</div>
    <div class="pills">
      <span class="pill plan">計:${plan}</span>
      <span class="pill today">予:${today}</span>
      <span class="pill actual">実:${actual}</span>
      <span class="pill remain">残:${remain}</span>
      <span class="pill promised_date">約:${promised_date}</span>
    </div>
  `;
  card.querySelector('.editBtn').addEventListener('click', e=>{
    e.stopPropagation(); openEditor(card);
  });
  card.addEventListener('dragstart', onCardDragStart);
  card.addEventListener('dragend', onCardDragEnd);
  return card;
}

function placeCards(){
  // 一旦全削除
  els('.lane').forEach(l=>{ [...l.querySelectorAll('.card')].forEach(c=>c.remove()); });

  // ソート：担当者・日付・順番
  const sorted=[...items].sort((a,b)=>{
    if(a.assignee_id!==b.assignee_id) return (a.assignee_id||'').localeCompare(b.assignee_id||'');
    if(a.date!==b.date) return (a.date||'').localeCompare(b.date||'');
    return (a.order??0)-(b.order??0);
  });

  for(const it of sorted){
    const lane=document.querySelector(`.lane[data-assignee="${it.assignee_id}"][data-date="${it.date}"]`);
    if(!lane) continue;
    lane.appendChild(makeCard(it));
  }

  enableLaneDnD();
  recalcSums();
}

/* ====== 集計 ====== */
function recalcSums(){
  const byDate=new Map(), byLane=new Map(), byUser=new Map();
  for(const it of items){
    const p=Number(it.plan||0), t=Number(it.today_plan||0), a=Number(it.actual||0);
    const dkey=it.date, lkey=`${it.assignee_id}|${it.date}`, ukey=it.assignee_id;

    const d=byDate.get(dkey)||{plan:0,today:0,actual:0}; d.plan+=p; d.today+=t; d.actual+=a; byDate.set(dkey,d);
    const l=byLane.get(lkey)||{plan:0,today:0,actual:0}; l.plan+=p; l.today+=t; l.actual+=a; byLane.set(lkey,l);
    const u=byUser.get(ukey)||{plan:0,today:0,actual:0}; u.plan+=p; u.today+=t; u.actual+=a; byUser.set(ukey,u);
  }
  // 日付ヘッダ
  dates.forEach(d=>{
    const s=byDate.get(d.date)||{plan:0,today:0,actual:0};
    const b=el(`#sum-${d.date}`); if(b) b.textContent=`計:${fmt(s.plan)} / 予:${fmt(s.today)} / 実:${fmt(s.actual)}`;
  });
  // 各マス・担当者合計
  const hidden = loadUserHidden();
  users.forEach(u=>{
    if(hidden.has(u.id)) return;
    dates.forEach(d=>{
      const key=`${u.id}|${d.date}`;
      const s=byLane.get(key)||{plan:0,today:0,actual:0};
      const lane=document.querySelector(`.lane[data-assignee="${u.id}"][data-date="${d.date}"]`);
      if(lane){ const badge=lane.querySelector('.laneSum'); if(badge) badge.textContent=`計:${fmt(s.plan)} / 予:${fmt(s.today)} / 実:${fmt(s.actual)}`; }
    });
    const us=byUser.get(u.id)||{plan:0,today:0,actual:0};
    const lab=el(`#user-sum-${u.id}`); if(lab) lab.textContent=`計:${fmt(us.plan)} / 予:${fmt(us.today)} / 実:${fmt(us.actual)}`;
  });
}

/* ====== DnD（カード移動・並べ替え） ====== */
let dragCard=null, placeholderEl=null;
function placeholder(){
  if(!placeholderEl){ const ph=document.createElement('div'); ph.className='placeholder'; placeholderEl=ph; }
  return placeholderEl;
}
function clearPlaceholder(){ if(placeholderEl?.parentNode) placeholderEl.parentNode.removeChild(placeholderEl); placeholderEl=null; }
function getInsertBefore(lane, mouseY){
  const cards=[...lane.querySelectorAll('.card:not(.dragging)')];
  for(const c of cards){ const r=c.getBoundingClientRect(); if(mouseY < r.top + r.height/2) return c; }
  return null;
}
function onCardDragStart(e){
  dragCard=e.currentTarget;
  dragCard.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain', dragCard.dataset.id||'');
}
function onCardDragEnd(){ clearPlaceholder(); dragCard?.classList.remove('dragging'); dragCard=null; }
function enableLaneDnD(){
  els('.lane').forEach(lane=>{
    lane.addEventListener('dragover', e=>{
      if(!dragCard) return;
      e.preventDefault();
      const ph=placeholder();
      const before=getInsertBefore(lane, e.clientY);
      if(before) lane.insertBefore(ph, before); else lane.appendChild(ph);
    });
    lane.addEventListener('drop', async e=>{
      e.preventDefault(); if(!dragCard) return;
      const ph=placeholderEl;
      if(ph && ph.parentNode===lane){ lane.insertBefore(dragCard, ph); } else { lane.appendChild(dragCard); }
      const siblings=[...lane.querySelectorAll('.card')];
      const idx=siblings.indexOf(dragCard);
      const prev=siblings[idx-1]||null, next=siblings[idx+1]||null;
      const a=prev?Number(prev.dataset.order||0):0;
      const b=next?Number(next.dataset.order||0):(a+20);
      const newOrder=Math.floor((a+b)/2);

      await patchCard({ id: dragCard.dataset.id, assignee_id: lane.dataset.assignee, date: lane.dataset.date, order: newOrder });

      dragCard.dataset.order=String(newOrder);
      const it=items.find(x=>x.id===dragCard.dataset.id);
      if(it){ it.assignee_id=lane.dataset.assignee; it.date=lane.dataset.date; it.order=newOrder; }

      clearPlaceholder(); onCardDragEnd(); recalcSums();
    });
  });
}

/* ====== 編集モーダル ====== */
let editingId=null;
function openEditor(card){
  const id=card.dataset.id;
  const it=items.find(x=>x.id===id);
  if(!it) return;
  editingId=id;

  el('#f_date').value = it.date || '';
  const sel=el('#f_assignee'); sel.innerHTML='';
  for(const u of users){
    const opt=document.createElement('option'); opt.value=u.id; opt.textContent=u.name;
    if(u.id===it.assignee_id) opt.selected=true; sel.appendChild(opt);
  }
  el('#f_plan').value   = it.plan??'';
  el('#f_today').value  = it.today_plan??'';
  el('#f_actual').value = it.actual??'';
  el('#f_remain').value = it.remaining??'';
  el('#f_promised_date').value = it.promised_date || '';
  el('#modal').classList.add('show');
}
function closeEditor(){ el('#modal').classList.remove('show'); editingId=null; }
el('#cancel').addEventListener('click', closeEditor);
el('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeEditor(); });
el('#save').addEventListener('click', async ()=>{
  if(!editingId) return;
  const it=items.find(x=>x.id===editingId); if(!it) return;
  const payload={
    id: editingId,
    date: valOrEmpty(el('#f_date').value),
    assignee_id: valOrEmpty(el('#f_assignee').value),
    plan: numOrNull(el('#f_plan').value),
    today_plan: numOrNull(el('#f_today').value),
    actual: numOrNull(el('#f_actual').value),
    remaining: numOrNull(el('#f_remain').value),
    promised_date: valOrEmpty(el('#f_promised_date').value)
  };
  await patchCard(payload);
  // ローカル反映
  if(payload.date!==undefined) it.date=payload.date;
  if(payload.assignee_id!==undefined) it.assignee_id=payload.assignee_id;
  if(payload.plan!==undefined) it.plan=payload.plan;
  if(payload.today_plan!==undefined) it.today_plan=payload.today_plan;
  if(payload.actual!==undefined) it.actual=payload.actual;
  if(payload.remaining!==undefined) it.remaining=payload.remaining;
  if(payload.promised_date!==undefined) it.promised_date=payload.promised_date;
  placeCards(); closeEditor(); showToast('更新しました');
});
function valOrEmpty(v){ return (v===''?undefined:v); }
function numOrNull(v){ if(v===''||v==null) return null; const n=Number(v); return isNaN(n)?null:n; }

/* ====== サーバ更新（通信中オーバーレイ対応） ====== */
async function patchCard(changes){
  const payload={}; for(const k of Object.keys(changes)){ if(changes[k]!==undefined) payload[k]=changes[k]; }
  el('#status').textContent='保存中…';
  showOverlay('通信中…');
  try{
    const r=await fetch('/notion_update.php',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-HTTP-Method-Override':'PATCH'},
      body: JSON.stringify(payload)
    });
    const j=await r.json().catch(()=> ({}));
    if(!r.ok || (j.status && j.status!==200)){ console.error('update fail', j); showToast('保存に失敗しました'); }
    else { showToast('保存しました'); }
  }finally{
    el('#status').textContent='';
    hideOverlay();
  }
}

/* ====== 並び替え/非表示（ローカル保存） ====== */
function loadUserOrder(){
  const raw=localStorage.getItem(storageKey('userOrder'));
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch{ return null; }
}
function saveUserOrder(){
  const order=users.map(u=>u.id);
  localStorage.setItem(storageKey('userOrder'), JSON.stringify(order));
}
function applyUserOrder(){
  const order=loadUserOrder();
  if(!order) return;
  const idx=new Map(order.map((id,i)=>[id,i]));
  users.sort((a,b)=>{
    const ia=idx.has(a.id)?idx.get(a.id):1e9;
    const ib=idx.has(b.id)?idx.get(b.id):1e9;
    return ia-ib;
  });
}
function loadUserHidden(){
  const raw=localStorage.getItem(storageKey('userHidden'));
  if(!raw) return new Set();
  try{ return new Set(JSON.parse(raw)); }catch{ return new Set(); }
}
function saveUserHidden(set){
  const arr=[...set];
  localStorage.setItem(storageKey('userHidden'), JSON.stringify(arr));
}

const reorderModal=el('#reorderModal');
el('#openReorder').addEventListener('click', ()=>{
  const ul=el('#uList'); ul.innerHTML='';
  const hidden = loadUserHidden();
  for(const u of users){
    const li=document.createElement('li');
    li.setAttribute('draggable','true');
    li.dataset.id=u.id;
    li.innerHTML=`
      <span>${u.name}</span>
      <span style="display:flex; align-items:center; gap:10px;">
        <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;">
          <input type="checkbox" class="hideChk" ${hidden.has(u.id)?'checked':''}> 非表示
        </label>
        <span class="drag">≡</span>
      </span>`;
    ul.appendChild(li);
  }
  setupDragList(ul);
  reorderModal.classList.add('show');
});
el('#reorderCancel').addEventListener('click', ()=>reorderModal.classList.remove('show'));
el('#reorderSave').addEventListener('click', ()=>{
  const ul=el('#uList');
  const ids=[...ul.children].map(li=>li.dataset.id);
  // users を ids 順に並べ替え
  const map=new Map(users.map(u=>[u.id,u]));
  users = ids.map(id=>map.get(id)).filter(Boolean);
  saveUserOrder();
  // 非表示の保存
  const hidden = new Set();
  [...ul.children].forEach(li=>{
    const chk=li.querySelector('.hideChk');
    if(chk && chk.checked) hidden.add(li.dataset.id);
  });
  saveUserHidden(hidden);

  buildRows(); placeCards();
  reorderModal.classList.remove('show');
});
function setupDragList(ul){
  let dragging=null;
  ul.addEventListener('dragstart', e=>{
    const li=e.target.closest('li'); if(!li) return;
    dragging=li; li.classList.add('ghost'); e.dataTransfer.effectAllowed='move';
  });
  ul.addEventListener('dragend', ()=>{
    if(dragging) dragging.classList.remove('ghost'); dragging=null;
  });
  ul.addEventListener('dragover', e=>{
    if(!dragging) return; e.preventDefault();
    const after=getDragAfterElement(ul, e.clientY);
    if(after==null) ul.appendChild(dragging); else ul.insertBefore(dragging, after);
  });
}
function getDragAfterElement(container, y){
  const els=[...container.querySelectorAll('li:not(.ghost)')];
  let closest=null, closestOffset=Number.NEGATIVE_INFINITY;
  for(const c of els){
    const box=c.getBoundingClientRect();
    const offset=y - box.top - box.height/2;
    if(offset<0 && offset>closestOffset){ closestOffset=offset; closest=c; }
  }
  return closest;
}

/* ====== 初期化 ====== */
async function bootstrap(){
  const qp=queryParams();
  el('#start').value = qp.start;
  el('#days').value  = String(qp.days);

  showOverlay('読み込み中…');
  try{
    const [u, g] = await Promise.all([
      getJSON('/notion_users.php'), // {users:[{id,name}]}
      getJSON(`/notion_grid.php?start=${encodeURIComponent(qp.start)}&days=${qp.days}`)
    ]);
    // users は grid 側が優先（id/name の確実な集合）。無ければ /notion_users.php
    const gridUsers = (g.users && g.users.length)? g.users : [];
    const apiUsers  = (u.users && u.users.length)? u.users : [];
    const mergedMap = new Map([...gridUsers, ...apiUsers].map(x=>[x.id, x.name]));
    users = [...mergedMap.entries()].map(([id,name])=>({id,name}));

    dates = g.dates || [];
    items = g.items || [];
    userMap = new Map(users.map(x=>[x.id, x.name]));

    // 以前の並び順を適用
    applyUserOrder();

    buildHeaders();
    buildRows();
    placeCards();
  } finally {
    hideOverlay();
  }
}

el('#reload').addEventListener('click', ()=>{
  const start=el('#start').value || new Date().toISOString().slice(0,10);
  const days = parseInt(el('#days').value,10)||14;
  const url = new URL(location.href);
  url.searchParams.set('start', start);
  url.searchParams.set('days', String(days));
  location.href = url.toString();
});

bootstrap().catch(err=>{
  console.error(err);
  hideOverlay();
  alert('読み込みに失敗しました。/notion_users.php と /notion_grid.php を確認してください。');
});
